meta:
  product: 论坛方向 Web 应用
modules:
  - name: 账号与访问
    description: 邮箱注册与登录、JWT 双令牌（access/refresh）与本地存储、请求 Bearer、启动时与 401 拦截后的 refresh 换票与登出；邮箱验证闭环（待验证页、重发冷却、邮件链接 exchange
      换票）；登录/注册页合规入口与路由守卫；找回密码（邮箱重置）已交付；第三方登录仅前端占位；登录错误码与限流以 user-service 为准；身份 claims（sub）与 Profile/论坛内容作者 ID 的对齐见
      openspec/specs/token-identity-consistency，与帖子与回复、个人中心协同定义。
  - name: 论坛壳与导航
    description: 全局顶栏、版区/分类入口、主题切换、统一发帖入口（与首页壳衔接）
  - name: 帖子与回复
    description: 发帖、正文与附件策略、楼层回复、编辑删除、草稿
  - name: 互动与声望
    description: 点赞/踩、收藏、关注、积分或等级（可与用户服务扩展）
  - name: 版区与标签
    description: 分区、置顶、精华、标签体系与筛选
  - name: 搜索与发现
    description: 全站/分区内搜索、热门与推荐 Feed（对接报表或检索占位）
  - name: 消息与通知
    description: 回复提醒、@、系统通知；可选站内信
  - name: 个人中心
    description: 资料、我的帖子/回复、设置；与现有 Profile 能力合并演进
  - name: 治理与审核
    description: 举报、屏蔽词、版主操作、审计日志
  - name: 运营与公告
    description: 公告位、活动 Banner（与首页右侧公告模块衔接）
  - name: 平台与基础设施
    description: 多服务鉴权、BFF/网关、限流、文件存储、Mongo/Redis 使用规范
priority_definitions:
  不指定: 尚未归类优先级或暂缓决策。
  不重要: 低优先级改进或排期靠后。
  次要: 规模与合规、非核心路径或体验增强；可延后。
  主要: 留存与活跃相关；搜索、通知、互动基础等。
  严重: 闭环必备；账号与访问、帖子与回复最小闭环、论坛壳与导航、个人中心基础等。
gitee_priority:
  api_numeric:
    不指定: 0
    不重要: 1
    次要: 2
    主要: 3
    严重: 4
gitee_content_classifications:
  - bug
  - duplicate
  - enhancement
  - feature
  - invalid
  - question
  - wontfix
milestones:
  - title: M1 — 可演示论坛 MVP
    description: 用户服务真实登录与 JWT；论坛首组 API；Feed/帖子页接数据；版区与标签只读与首页对齐已交付。版主/标签后台与算法热榜见 M3 独立 Issue。
    due_on: 2026-06-30
  - title: M2 — 互动与发现
    description: 已交付：帖子搜索、站内通知、用户主键与「我的帖子」约定。待办：帖子点赞与收藏；个人中心与内容管理最小集；公告位与热门数据接口（均见 open Issue）。
    due_on: 2026-09-30
  - title: M3 — 治理与增长
    description: 举报与审核、反垃圾；版主版区操作与标签后台管理；推荐排序/报表与个性化热榜进阶；见本里程碑 open Issue。
    due_on: 2026-12-31
issues:
  - title: 论坛版区与标签只读展示与首页对齐
    body: |
      验收标准：
      - 版区/分类与论坛首组 API 或唯一配置源一致；左侧只读展示，切换版区时帖子列表按 boardId 筛选可演示。
      - 标签：卡片上 tags 与数据源一致；右侧「热门标签」等与卡片 tags 同一词表来源（只读 tag 列表 API，或对帖子 tags 聚合的 Top N），禁止与真实帖子标签无关的硬编码词表。
      - 按标签驱动列表：若列表接口支持按 tag 筛选，则点击标签刷新列表，加载/空/错/限流态与 forum-homepage-shell 中搜索驱动区域可区分；若 M1 不做该参数，则验收固定为「标签只读 + 点击走站内关键词搜索（q）」之一并在 spec 或本条目中写明，禁止双口径验收。
      - 与 forum-homepage-shell 对齐：字段名、空态（无版区、无标签、无帖子、请求失败可区分）。
      与 M2 划界：复杂热榜与运营榜单接口归入 M2「公告位与热门数据接口」等条目；本条只做只读展示与频次或配置级 Top N。
      依赖：openspec/specs/forum-homepage-shell/spec.md；论坛领域首组 API（已实现）。
      已交付：按上述验收口径完成；原非目标「版主编辑、标签后台管理」「个性化推荐与算法化热榜」已拆分为 M3 独立 Issue。
    milestone: M1 — 可演示论坛 MVP
    gitee_number: IILVVX
    priority: 次要
    state: closed
    module: 版区与标签
    classification: enhancement
  - title: 版主版区与帖子操作后台（最小集）
    body: |
      验收标准：
      - 具备版主或管理员角色边界（与 JWT/角色声明一致）；可对帖子执行至少一种版区操作（如置顶、精华、锁帖或等价）并持久化，列表与详情可反映状态。
      - 操作审计字段可核验（操作者 sub、目标帖子、时间）；非法或未授权请求有明确错误码。
      依赖：论坛领域首组 API 与版区数据模型；openspec/specs/token-identity-consistency。
      非目标：完整 RBAC 中台、跨版区批量脚本、工单流。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 标签体系后台管理（CRUD 与绑定规则）
    body: |
      验收标准：
      - 提供标签的创建、编辑、禁用/合并等最小管理能力（API 或管理端择一），与前台只读词表同源；帖子绑定/解绑规则可文档化或演示。
      - 与论坛帖子 tags 字段及列表筛选行为一致，禁止与硬编码占位词表分裂。
      依赖：论坛版区与标签只读展示与首页对齐（已关闭条目）；forum-homepage-shell 与 forum 内容 API 约定。
      非目标：多语言同义词图谱、运营标签 A/B、第三方标签云同步。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 版区与标签
    classification: feature
  - title: 个性化推荐与算法化热榜
    body: |
      验收标准：
      - 在「时间序 / 简易热度」之上，增加可配置的算法化排序或热榜策略至少一种（规则或离线分可接受），与 Feed/侧栏数据合同对齐；可观测指标（曝光、点击等择一）占位或与 report-service 衔接说明。
      - 与 M2「公告位与热门数据接口」、M3「推荐排序与运营报表出口占位」的边界写清：本条负责推荐/热榜算法侧进阶，不重复占位接口验收。
      依赖：论坛帖子与互动数据基础；推荐排序与运营报表出口占位（同里程碑 open Issue，可并行演进）。
      非目标：深度学习实时训练、多业务线统一推荐中台、商业级冷启动策略。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 搜索与发现
    classification: feature
  - title: 帖子点赞与收藏基础
    body: |
      验收标准：
      - 提供可对帖子（及必要时回复）点赞与收藏的 HTTP API 或经 BFF 暴露的统一接口；登录态下操作与取消可验证，未登录行为有约定（拒绝或匿名策略文档化）。
      - 列表或详情可展示计数或状态（至少其一可联调）；与 JWT `sub` 身份一致，不另造用户键。
      依赖：openspec/specs/token-identity-consistency；论坛帖子实体与鉴权现状。
      非目标：积分等级、踩、关注链；实时推送。
    milestone: M2 — 互动与发现
    gitee_number: IILVW7
    priority: 主要
    state: open
    module: 互动与声望
    classification: feature
  - title: 个人中心与内容管理最小集
    body: |
      验收标准：
      - 个人中心页（或等价路由）可维护资料（与现有 Profile 能力衔接）、入口到「我的帖子/回复」列表且查询键与 token `sub` 一致。
      - 基础设置或占位（如主题、退出）与空态、失败提示可演示；与 customer-profile 或既有 Profile API 不冲突。
      依赖：openspec/specs/customer-profile-service（若适用）；openspec/specs/token-identity-consistency；论坛「我的」查询与 JWT `sub` 一致（已实现）。
      非目标：完整账号安全中心、第三方绑定、消息全渠道设置。
    milestone: M2 — 互动与发现
    gitee_number: IILVWJ
    priority: 主要
    state: open
    module: 个人中心
    classification: feature
  - title: 公告位与热门数据接口
    body: |
      验收标准：
      - 公告：提供至少一种可读公告数据源（静态配置、CMS 占位或 API），与首页/论坛壳右侧公告模块字段约定一致并可空态展示。
      - 热门：提供榜单或热门帖子列表接口（可由 Model/BFF/报表占位），与首页「热门」区块对齐；分页或条数上限有约定。
      - 鉴权边界（公开只读 vs 管理端）在文档或代码中可核验。
      依赖：openspec/specs/forum-homepage-shell/spec.md（若含侧栏）；里程碑 M2 描述。
      非目标：推荐算法、A/B、运营后台完整 CMS。
    milestone: M2 — 互动与发现
    gitee_number: IILVWO
    priority: 次要
    state: open
    module: 运营与公告
    classification: feature
  - title: 论坛举报与处理最小闭环
    body: |
      验收标准：
      - 用户可对帖子或回复发起举报并产生可查询记录；处理侧至少具备列表查看或状态流转占位，行为可演示。
      - 与鉴权、审计字段约定一致（操作者、目标资源标识）。
      依赖：里程碑 M3；openspec 治理相关条款（若有）。
      非目标：完整工单 SLA、法务级证据链、多租户隔离策略。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 反垃圾与自动处置占位
    body: |
      验收标准：
      - 在文档或配置层定义反垃圾策略占位（关键词、频率、人机挑战接入点等择一），与发帖/回复链路的挂钩方式可说明。
      - 与现有 user-service / Model 限流能力可复用处有对照说明。
      依赖：里程碑 M3。
      非目标：自建大模型审核、全站实时风控中台。
    milestone: M3 — 治理与增长
    priority: 次要
    state: open
    module: 治理与审核
    classification: enhancement
  - title: 推荐排序与运营报表出口占位
    body: |
      验收标准：
      - 列表或 Feed 可切换「时间序 / 简易热度」等占位策略之一，查询参数、默认值与回退行为文档化或可联调。
      - 报表或 BFF 提供至少一种只读运营指标出口（与现有 report-service 或占位路由对齐）；失败与空数据可处理。
      依赖：openspec/specs/report-service（若适用）；里程碑 M3。
      非目标：A/B 实验平台、计费级报表；个性化与算法化热榜见同里程碑 Issue「个性化推荐与算法化热榜」。
    milestone: M3 — 治理与增长
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
