  - title: 版主锁帖与加精操作
    body: |
      验收标准：
      - 版主（`forumBoardIds` 覆盖目标版区）可对帖子执行**加精/取消精华**操作，状态持久化；帖子详情与列表字段（`isFeatured`）可反映最新状态；首页「精华」Tab 按 `isFeatured: true` 筛选（当前 Tab 已占位但 fallback 到 latest，需接入真实字段）。
      - 审计记录包含操作类型（`feature`/`unfeature`）、操作者 `sub`、目标 `postId` 与 `boardId`；与现有 `GET /api/mod/audit` 列表结构兼容，`actionLabel` 可人读。
      - 加精/取消精华不影响回复权限。
      - 非法版区范围或未授权角色的请求返回 403；未登录返回 401。
      部分已交付（无需重复验收）：锁帖（`RepliesLocked`）后端 API `POST /api/mod/posts/{postId}/replies-locked` 与前端 `ForumPostGovernancePanel`、`ForumRepliesLockedMark` 已完整实现（Issue #7 延伸交付）。
      依赖：Issue #7 closed（sticky/audit 路由与鉴权模式可复用）；`openspec/specs/forum-moderation-post-ops`；`openspec/specs/token-identity-consistency`。
      非目标：沉帖（降权/隐藏帖）；批量操作；跨版区脚本；加精多级评级。
