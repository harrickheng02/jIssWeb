  - title: 举报后续：账号处罚、工单 SLA、举报人通知与证据导出
    body: |
      **新开需求**，承接 Issue #4 已交付最小闭环之外的治理能力；交付以子 Issue / OpenSpec change 拆分为准。
      已规划子 Issue：
      - Issue #21 举报人结案站内通知（当前阶段，依赖已满足）
      后续方向（未单开子 Issue，时序待定）：
      - 账号处罚与 user-service API/事件契约（警告/禁言/封禁择一或多）
      - SLA / 指派或升级队列（工单级，与 Issue #18 审计深化可并行规划边界）
