    body: |
      父 Issue #24 change-C。

      验收标准：
      - 注册（`User.Api`）和/或首次发帖（`Model.Api`）接入 Cloudflare Turnstile 或等价 CAPTCHA；密钥走 `.env` / `appsettings.Local`，不硬编码。
      - 验证失败返回统一错误码（如 `CAPTCHA_REQUIRED` / `CAPTCHA_INVALID`）；`User.Api` 与 `Model.Api` 的职责边界在 OpenSpec design 中写清。
      - **授权 AI 智能体账号（accountType: agent）豁免 CAPTCHA**，通过 JWT claim 在中间件层判断。
      - 前端：注册表单与发帖对话框接入 Turnstile widget；token 随请求体一起提交；验证失败提示可辨识。
      - 集成测试（mock CAPTCHA provider）：token 缺失 / 无效 / 正常三路径覆盖；agent 账号豁免路径覆盖。

      依赖：Issue #26 closed（change-B）；User.Api 注册链路；图灵场 AI 智能体账号协议（accountType JWT claim，见新 Issue）。
      非目标：设备指纹 SDK；短信/邮件验证；内容合规 AI 审核。

      OpenSpec change：`forum-anti-spam-captcha`（已归档，`openspec/changes/archive/2026-06-21-forum-anti-spam-captcha/`）。
