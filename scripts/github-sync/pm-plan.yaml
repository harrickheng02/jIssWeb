  - title: 帖子与回复自编辑及草稿最小集
    body: |
      验收标准：
      - 帖子作者可编辑自己已发布帖的 title、body、tags；非作者 403；已发布帖不可更换板块（`BOARD_NOT_EDITABLE`）。
      - 回复作者可编辑自己回复正文；锁帖下存量回复仍可编辑；已删帖/已删回复不可编辑。
      - 草稿：`state: draft` 服务端持久化；`POST/PUT/DELETE /api/forum/posts/drafts`、`GET /api/forum/me/drafts`；发布走 `POST /api/forum/posts/drafts/{id}/publish`；个人中心 `/me/drafts`（标题点击进入编辑，外部发布/删除，对话框 取消/保存草稿/发布）。
      - 软删除：版主删帖/删回复改 State=deleted；公开列表/详情过滤 draft/deleted；作者自删与 0 互动永久删；`DraftCleanupBackgroundService` 保留期清理。
      - 集成测试：作者编辑、Tags UseCount delta、草稿 CRUD/发布、State 过滤、自删与版主删（154/154）；前端 compose 单测 7/7。
      依赖：`openspec/specs/forum-content-api`；Issue #2 closed（个人中心草稿子视图）。
      非目标：版本历史；富文本升级；协作编辑；草稿分享/多设备同步；草稿回收站 UI；版主删帖前台恢复。
      交付确认：`ForumPostsController` PUT 自编辑/自删、`ForumDraftsController` 草稿 CRUD/发布、`ForumMeController` drafts 列表；`MeDraftsView.vue`、`useForumComposeForm` 三模式；规范见 `openspec/specs/forum-post-self-edit`、`forum-draft-lifecycle`、`forum-soft-delete` 及 `forum-content-api` 增量；变更归档 `openspec/changes/archive/2026-05-31-forum-post-edit-draft-minimal/`。
    milestone: M3 — 治理与增长
