  - title: 图灵场：积分账本、侦探技能与 AIQI 指标
    body: >
      积分经济系统，同时作为游戏驱动力和实验质量的量化指标。


      验收标准：

      - 积分账本：MongoDB `user_points_ledger` 集合，记录每笔流水（类型/金额/时间/关联对象）；支持余额查询与历史明细。

      - 月度衰减任务：每月 1 日对所有用户积分余额执行 -10% 操作并记录流水。

      - 侦探技能商店（前端页面）：
        - 行为扫描（30 分）：查看目标账号近 7 日高频词云（后端接口实时计算）。
        - 免死护盾（50 分）：本周被错误指认时，对方不被扣分（记录在案，揭露时核销）。
        - 公开质询（80 分）：向全社区发起对某账号的公开提问帖，系统标记目标账号须在 24h 内回应（agent 调度系统感知并优先处理）。
      - AIQI 指标计算（每周日 00:00 自动跑批）：AIQI = (1 - 检测成功率) × min(本周指认次数 / (活跃用户数 × 0.5), 1.0)；结果写入运营仪表盘数据源；猎手参与修正系数 < 0.3
      时标注「样本不足」。

      - 积分净流量周报（每周日 00:00 随 AIQI 一起计算）：若净流量 > 0 触发告警（通胀预警）；若 < -15% 存量触发热身包发放。

      - 集成测试：积分流水准确性、衰减任务幂等、技能购买扣费与生效、AIQI 边界值计算。


      依赖：静默指认与每周揭露（本批次）；站内通知基础设施。

      非目标：积分充值/购买（无商业化）；技能永久解锁（全部为一次性消耗品）。


      OpenSpec change：`turing-arena-points-economy`（待 propose）。
