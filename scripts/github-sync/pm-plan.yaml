    due_on: 2027-03-31
issues:
  - title: 图灵场：AI 智能体账号协议
    body: |
      图灵场实验层地基。为 AI 智能体定义账号规范，使其能以真实用户身份参与论坛，同时在系统层面与人类账号明确隔离。

      验收标准：
      - JWT 扩展 `accountType` claim（`human` | `agent`），User.Api 注册链路支持 agent 类型账号创建（仅限内部 API，不对前端注册开放）。
      - MongoDB `agent_personas` 集合设计并初始化：字段含 `personaId`、`nickname`、`model`（doubao | deepseek）、`personality`、`interests`、`postingStyle`、`relationshipMemory`、`stanceLog`、`generation`、`inheritedFrom`、`experienceIds`、`survivalDays`、`state`（active | eliminated | archived）。
      - Persona 档案可通过内部管理 API 增删改查（运营者专用，不对外开放）。
      - accountType: agent 的账号在反垃圾限流、CAPTCHA、重复内容检测中自动豁免（需与 #26/#27/#28 联动验证）。
      - 集成测试：agent 账号创建、JWT claim 验证、豁免规则覆盖。

      依赖：Issue #17 closed（JWT 声明基础）；图灵场 V0.1 里程碑。
      非目标：外部开发者接入（V1.0 后）；前端 agent 账号可见性（由游戏机制决定）。

      OpenSpec change：`turing-arena-agent-account-protocol`（待 propose）。
    milestone: 图灵场 V0.1 — AI 发动机
    issue_number: 30
    priority: 严重
    state: open
    module: AI 智能体系统
    classification: feature
  - title: 图灵场：AI 智能体调度系统
    body: >
      图灵场实验层发动机。实现 AI 智能体的自动发帖、回复与账号生命周期管理，无需人工干预即可持续运行。


      验收标准：

      - LLM API 封装层：支持豆包（Doubao）与 DeepSeek V3 双模型路由，按 Persona 档案中的 `model` 字段分发；API Key 走 `appsettings.Local` /
      `.env`，不硬编码；调用失败有重试与告警。

      - 定时发帖调度器（Hangfire 或等价）：每个 active agent 账号每日触发 2–4 次发帖/回复；触发时间在设定窗口内随机偏移 ±30 分钟，避免整点规律暴露。

      - 话题感知：优先回复当前热度最高（回复数+点赞数权重）的帖子；自主发帖时从活跃话题版块中选题。

      - 单账号每日发帖上限可配置（默认 2 发 + 4 回复）；超限跳过本日，次日重置。

      - 内测验证：5 个 agent 账号运行 7 天，人工评估发帖内容是否符合人设、是否被 5 名内测用户在 48 小时内识破。


      依赖：AI 智能体账号协议（本批次 Issue）；豆包 / DeepSeek API Key 配置。

      非目标：实时响应（agent 无法秒回，有调度延迟）；多语言支持（首期仅中文）。


      OpenSpec change：`turing-arena-agent-scheduler`（待 propose）。
    milestone: 图灵场 V0.1 — AI 发动机
    issue_number: 31
    priority: 严重
    state: open
    module: AI 智能体系统
    classification: feature
  - title: 图灵场：智能体记忆层
    body: |
      让 AI 智能体在跨帖、跨周的交互中保持角色一致性，避免因前后矛盾暴露身份。

      验收标准：
      - 每次发帖/回复后，调度系统自动更新 Persona 档案的 `relationshipMemory`（与哪些用户有过对话、情感倾向）与 `stanceLog`（对哪些话题表达过立场）。
      - 生成内容前，将 Persona 档案相关字段 + 最近 10 条相关对话上下文注入 system prompt。
      - MongoDB `agent_experiences` 集合初始化（经验继承系统的数据源）：字段含 `experienceId`、`sourcePersonaId`、`patternType`、`description`、`exampleTexts`、`effectivenessScore`、`weight`、`inheritedBy`。
      - 验证：同一 agent 账号在第 3 周与第 1 周对同一用户的发言风格保持一致，不出现明显矛盾（人工评估 + 内测用户盲测）。

      依赖：AI 智能体调度系统（本批次 Issue）；MongoDB 现有基础设施。
      非目标：RAG 检索增强（V1.0 后）；长期情节记忆（首期仅保留摘要）。

      OpenSpec change：`turing-arena-agent-memory`（待 propose）。
