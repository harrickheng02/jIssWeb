  - title: 个性化推荐与算法化热榜
    body: |
      验收标准：
      - 在「时间序 / 简易热度」之上，增加可配置的算法化排序或热榜策略至少一种，与 Feed/侧栏数据合同对齐。
      - 与「推荐排序与运营报表出口」（Issue #6）的边界写清：本条负责推荐/热榜算法侧进阶。
