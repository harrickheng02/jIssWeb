  - title: 推荐排序与运营报表出口
    body: >
      验收标准：

      - **排序策略**：`GET /api/forum/posts` 支持 `sort` 查询参数（至少 `latest`/`hot` 两种），`hot` 以回复数或点赞数的简单权重排序；默认值与空参数回退行为写清。

      - **运营指标出口**：`JIssWeb.Report.Api`（或 BFF
      占位路由）提供至少一个只读端点，返回指定时间段内帖子数/活跃用户数/回复数之一；无数据时返回空集合；鉴权边界写清。该接口同时服务图灵场运营仪表盘的社区数据面板（帖子总量、AI vs 人类发帖比例）。

      依赖：`GET /api/forum/posts` 现有分页合同（`openspec/specs/forum-content-api`）。 非目标：A/B 实验平台、计费级报表；个性化与算法化热榜（见 Issue
      #9）；实时大屏；图灵场 AIQI 指标计算（属实验层，不在本条）。
