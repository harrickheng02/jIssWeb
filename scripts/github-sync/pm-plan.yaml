  - title: 帖子操作记录筛选深化与举报审计补齐
    body: |
      父 Issue #18 已交付子项。OpenSpec change `forum-moderation-audit-post-filters`。
      验收标准：
      - **按帖审计 API 扩展**：`GET /api/mod/audit?targetType=post&targetId=` 在现有分页基础上支持可选 `action`（单值或多值，与 `ModerationAuditPresentation` 动作码一致）、`fromUtc` / `toUtc`；非法组合返回统一错误合同；版主鉴权与现有一致。
      - **帖线程审计范围扩展**：除帖/回复治理动作外，纳入与该帖关联的 `user.warn` / `user.mute` / `user.unmute`（经 `metadata.reportId` 关联到该帖举报，或 `metadata.postId` 等于帖 id）；排序仍按 `occurredAtUtc` 降序。
      - **举报 workflow 写审计**：`ModReportsController.PatchStatus` 在 `resolved` / `rejected` 结案时写审计（含 `metadata.reportId`、`metadata.postId` 当 target 为帖/回复时）；`Acknowledge` 写 `report.acknowledge`（或等价动作码）审计；幂等重试不产生重复审计行（以业务键或 upsert 策略在规范中定义）。
      - **前端帖详情抽屉**：`ForumPostGovernancePanel` 操作记录区增加操作类型筛选、时间范围筛选与分页控件；筛选变更重置页码；空结果与错误态可辨。
      - 集成测试：筛选组合、分页边界、举报结案/受理审计写入、帖上下文展示作者处罚记录；回归现有按帖审计与 #20 治理动作。
      依赖：Issue #7 closed；Issue #17 closed；Issue #20 closed；Issue #19 change-A/B merged（`reportId` 审计契约、`ModReportsController`）；`openspec/specs/forum-moderation-post-ops`、`forum-moderation-sticky-ui`、`forum-report-api`、`forum-user-sanctions`。
      非目标：不绑定帖子的全局审计 feed 页；版区跨帖筛选；审计 CSV/zip 导出；新帖子治理动作（沉帖等）。
      交付确认：`ModAuditController` action/fromUtc/toUtc 筛选；`PostThreadAuditQuery` 帖线程 user/report 分支；`ForumReportModerationAuditWriter` 结案/受理写审计；`ModUserSanctionsController` 处罚/unmute `metadata.postId`；`ForumPostGovernancePanel` 筛选/分页/重试；`listModerationAuditByPost` Axios query 序列化（`paramsSerializer: { indexes: null }`）；测试 `ForumModerationAuditFilterTests`、`clients.moderation-audit.test.ts` 等；规范见上述四份 spec 增量；变更归档 `openspec/changes/archive/2026-06-01-forum-moderation-audit-post-filters/`。
    milestone: M3 — 治理与增长
