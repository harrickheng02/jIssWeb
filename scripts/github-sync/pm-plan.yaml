meta:
  product: 论坛方向 Web 应用
modules:
  - name: 账号与访问
    description: 邮箱注册与登录、JWT 双令牌（access/refresh）与本地存储、请求 Bearer、启动时与 401 拦截后的 refresh 换票与登出；邮箱验证闭环（待验证页、重发冷却、邮件链接 exchange
      换票）；登录/注册页合规入口与路由守卫；找回密码（邮箱重置）已交付；第三方登录仅前端占位；登录错误码与限流以 user-service 为准；身份 claims（sub）与 Profile/论坛内容作者 ID 的对齐见
      openspec/specs/token-identity-consistency，与帖子与回复、个人中心协同定义。
  - name: 论坛壳与导航
    description: 全局顶栏、版区/分类入口、主题切换、统一发帖入口（与首页壳衔接）
  - name: 帖子与回复
    description: 发帖、正文与附件策略、楼层回复、编辑删除、草稿
  - name: 互动与声望
    description: 点赞/踩、收藏、关注、积分或等级（可与用户服务扩展）
  - name: 版区与标签
    description: 分区、置顶、精华、标签体系与筛选
  - name: 搜索与发现
    description: 全站/分区内搜索、热门与推荐 Feed（对接报表或检索占位）
  - name: 消息与通知
    description: 回复提醒、@、系统通知；可选站内信
  - name: 个人中心
    description: 资料、我的帖子/回复、设置；与现有 Profile 能力合并演进
  - name: 治理与审核
    description: 举报、屏蔽词、版主操作、审计日志
  - name: 运营与公告
    description: 公告位、活动 Banner（与首页右侧公告模块衔接）
  - name: 平台与基础设施
    description: 多服务鉴权、BFF/网关、限流、文件存储、Mongo/Redis 使用规范
priority_definitions:
  不指定: 尚未归类优先级或暂缓决策。
  不重要: 低优先级改进或排期靠后。
  次要: 规模与合规、非核心路径或体验增强；可延后。
  主要: 留存与活跃相关；搜索、通知、互动基础等。
  严重: 闭环必备；账号与访问、帖子与回复最小闭环、论坛壳与导航、个人中心基础等。
remote_priority:
  api_numeric:
    不指定: 0
    不重要: 1
    次要: 2
    主要: 3
    严重: 4
issue_content_classifications:
  - bug
  - duplicate
  - enhancement
  - feature
  - invalid
  - question
  - wontfix
milestones:
  - title: M1 — 可演示论坛 MVP
    description: 用户服务真实登录与 JWT；论坛首组 API；Feed/帖子页接数据；分类与标签只读
    due_on: 2026-06-30
  - title: M2 — 互动与发现
    description: 点赞收藏、通知、搜索；个人中心与内容管理；公告与热门接口
    due_on: 2026-09-30
  - title: M3 — 治理与增长
    description: 审核举报、反垃圾占位；推荐排序；运营与报表
    due_on: 2026-12-31
  - title: W — 工作流程与工程效能
    description: 与 M1–M3 产品交付解耦：策划案入库、审阅门禁、路由与路径校验、CI/hooks、复盘与图谱刷新；排期与业务里程碑独立叙述。
    due_on: 2026-12-31
issues:
  - title: 帖子点赞与收藏基础
    body: |
      验收标准：
      - 提供可对帖子（及必要时回复）点赞与收藏的 HTTP API 或经 BFF 暴露的统一接口；登录态下操作与取消可验证，未登录行为有约定（拒绝或匿名策略文档化）。
      - 列表或详情可展示计数或状态（至少其一可联调）；与 JWT `sub` 身份一致，不另造用户键。
      依赖：openspec/specs/token-identity-consistency；论坛帖子实体与鉴权现状。
      非目标：积分等级、踩、关注链；实时推送。
    milestone: M2 — 互动与发现
    priority: 主要
    state: open
    module: 互动与声望
    classification: feature
  - title: 个人中心与内容管理最小集
    body: >
      验收标准：

      - 个人中心页（或等价路由）可维护资料（与现有 Profile 能力衔接）、入口到「我的帖子/回复」列表且查询键与 token `sub` 一致。

      - 基础设置或占位（如主题、退出）与空态、失败提示可演示；与 customer-profile 或既有 Profile API 不冲突。

      依赖：openspec/specs/customer-profile-service（若适用）；openspec/specs/token-identity-consistency；论坛「我的」查询与 JWT `sub`
      一致（已实现）。

      非目标：完整账号安全中心、第三方绑定、消息全渠道设置。
    milestone: M2 — 互动与发现
    priority: 主要
    state: open
    module: 个人中心
    classification: feature
  - title: 公告位与热门数据接口
    body: |
      验收标准：
      - 公告：提供至少一种可读公告数据源（静态配置、CMS 占位或 API），与首页/论坛壳右侧公告模块字段约定一致并可空态展示。
      - 热门：提供榜单或热门帖子列表接口（可由 Model/BFF/报表占位），与首页「热门」区块对齐；分页或条数上限有约定。
      - 鉴权边界（公开只读 vs 管理端）在文档或代码中可核验。
      依赖：openspec/specs/forum-homepage-shell/spec.md（若含侧栏）；里程碑 M2 描述。
      非目标：推荐算法、A/B、运营后台完整 CMS。
    milestone: M2 — 互动与发现
    priority: 次要
    state: open
    module: 运营与公告
    classification: feature
  - title: 论坛举报与处理最小闭环
    body: |
      验收标准：
      - 用户可对帖子或回复发起举报并产生可查询记录；处理侧至少具备列表查看或状态流转占位，行为可演示。
      - 与鉴权、审计字段约定一致（操作者、目标资源标识）。
      依赖：里程碑 M3；openspec 治理相关条款（若有）。
      非目标：完整工单 SLA、法务级证据链、多租户隔离策略。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 反垃圾与自动处置占位
    body: |
      验收标准：
      - 在文档或配置层定义反垃圾策略占位（关键词、频率、人机挑战接入点等择一），与发帖/回复链路的挂钩方式可说明。
      - 与现有 user-service / Model 限流能力可复用处有对照说明。
      依赖：里程碑 M3。
      非目标：自建大模型审核、全站实时风控中台。
    milestone: M3 — 治理与增长
    priority: 次要
    state: open
    module: 治理与审核
    classification: enhancement
  - title: 推荐排序与运营报表出口占位
    body: |
      验收标准：
      - 列表或 Feed 可切换「时间序 / 简易热度」等占位策略之一，查询参数、默认值与回退行为文档化或可联调。
      - 报表或 BFF 提供至少一种只读运营指标出口（与现有 report-service 或占位路由对齐）；失败与空数据可处理。
      依赖：openspec/specs/report-service（若适用）；里程碑 M3。
      非目标：A/B 实验平台、计费级报表；个性化与算法化热榜见同里程碑 Issue「个性化推荐与算法化热榜」。
    milestone: M3 — 治理与增长
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 版主版区与帖子操作后台（最小集）
    body: |
      验收标准：
      - 具备版主或管理员角色边界（与 JWT/角色声明一致）；可对帖子执行至少一种版区操作（如置顶、精华、锁帖或等价）并持久化，列表与详情可反映状态。
      - 操作审计字段可核验（操作者 sub、目标帖子、时间）；非法或未授权请求有明确错误码。
      依赖：论坛领域首组 API 与版区数据模型；openspec/specs/token-identity-consistency。
      非目标：完整 RBAC 中台、跨版区批量脚本、工单流。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 标签体系后台管理（CRUD 与绑定规则）
    body: |
      验收标准：
      - 提供标签的创建、编辑、禁用/合并等最小管理能力（API 或管理端择一），与前台只读词表同源；帖子绑定/解绑规则可文档化或演示。
      - 与论坛帖子 tags 字段及列表筛选行为一致，禁止与硬编码占位词表分裂。
      依赖：论坛版区与标签只读展示与首页对齐（已关闭条目）；forum-homepage-shell 与 forum 内容 API 约定。
      非目标：多语言同义词图谱、运营标签 A/B、第三方标签云同步。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 版区与标签
    classification: feature
  - title: 个性化推荐与算法化热榜
    body: |
      验收标准：
      - 在「时间序 / 简易热度」之上，增加可配置的算法化排序或热榜策略至少一种（规则或离线分可接受），与 Feed/侧栏数据合同对齐；可观测指标（曝光、点击等择一）占位或与 report-service 衔接说明。
      - 与 M2「公告位与热门数据接口」、M3「推荐排序与运营报表出口占位」的边界写清：本条负责推荐/热榜算法侧进阶，不重复占位接口验收。
      依赖：论坛帖子与互动数据基础；推荐排序与运营报表出口占位（同里程碑 open Issue，可并行演进）。
      非目标：深度学习实时训练、多业务线统一推荐中台、商业级冷启动策略。
    milestone: M3 — 治理与增长
    priority: 主要
    state: open
    module: 搜索与发现
    classification: feature
  - title: 工作流程：策划案入库与 pm-plan/OpenSpec 衔接
    body: |
      验收标准：
      - 提供与业务需求解耦的「策划案/需求说明」入库位置与命名约定（如 `docs/pm/` 或等价模板），写明如何映射到 `pm-plan.yaml` Issue 与 `openspec/changes/**`。
      - README 或 `.cursor/skills/pm-plan/SKILL.md` 中增加指向，使跨会话可复用同一入口；不包含论坛/账号等业务功能验收。
      依赖：`.cursor/skills/pm-plan/SKILL.md`；`openspec/specs/shared-foundation/spec.md`（若需统一文档层级）。
      非目标：替代 GitHub Issue；业务领域 spec 编写。
    milestone: W — 工作流程与工程效能
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 工作流程：变更审阅与合并门禁清单
    body: |
      验收标准：
      - 提供与业务无关的 PR/合并检查单（Markdown 或模板），至少包含：关联 pm-plan Issue（若适用）、OpenSpec 任务勾选或变更归档引用、`npm run graph:verify` 或等价说明。
      - 团队可勾选演示一次「未满足门禁则不合并」的流程（可为人工执行，须文档化）。
      - 可选：与业务用例解耦的横切「契约/集成测试」清单（如 graph:verify、身份相关最小用例），仅作合入参考项。
      依赖：`openspec/specs/repo-knowledge-router/spec.md`（索引与校验范围）；仓库既有 CI 配置（若有）。
      非目标：强制特定商业审批流；替代代码审查讨论。
    milestone: W — 工作流程与工程效能
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 工作流程：Issue 文档路径与知识路由工程化
    body: |
      验收标准：
      - 约定 pm-plan 中工程类 Issue 的 `body` 须含至少一条可校验 `openspec/specs/**` 或 `.cursor/rules/**` 路径；提供校验方式（脚本或 CI 调用 `npm run graph:verify`）。
      - `graph:route` 或 `PM_OPEN_ISSUES.md` 生成逻辑中，对「无路径」Issue 有可见提示或分级策略；与业务 Issue 的验收条款解耦（本条不验收业务功能）。
      依赖：`openspec/specs/repo-knowledge-router/spec.md`；`scripts/repo-knowledge-router/` 现状。
      非目标：语义向量检索；替换 GitHub 标签体系。
    milestone: W — 工作流程与工程效能
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 工作流程：CI 与可选 Git hooks 闭环
    body: |
      验收标准：
      - CI 或文档中明确 `graph:verify`（及可选测试子集）在合并前的触发点；失败时阻断合并或标红（与具体业务测试解耦）。
      - 可选：`.githooks/pre-commit` 与 `core.hooksPath` 的启用说明与失败时的「终止提交」行为写清；stop 语义为「校验失败即不进入后续步骤」。
      依赖：仓库根 `package.json` 中 `graph:verify`；`.githooks/pre-commit`（若存在）。
      非目标：全量 E2E 替代；Cursor 云端强制策略。
    milestone: W — 工作流程与工程效能
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 工作流程：复盘沉淀与图谱刷新节奏
    body: |
      验收标准：
      - 文档化「复盘 → 更新 `.cursor/rules` 或 `openspec/specs` → 执行 `npm run graph:refresh`」的节奏（如每迭代或每归档一次），与业务发版节奏解耦说明。
      - 一次演练记录：从合并 PR 到刷新 `graph.json` / `PM_OPEN_ISSUES.md` 的责任人/触发条件可核验。
      依赖：`openspec/specs/repo-knowledge-router/spec.md`；`npm run graph:refresh`。
      非目标：自动从对话蒸馏规则；多仓库联邦图谱。
    milestone: W — 工作流程与工程效能
    priority: 不重要
    state: open
    module: 平台与基础设施
    classification: enhancement
