meta:
  product: 图灵场 — 人机共生社区实验平台
  scope_note: |
    【产品定位】图灵场是以论坛为骨架的开源人机共生社区实验场。用户明确知道社区中存在
    AI 智能体，但不知道具体谁是 AI——以「发现隐藏 AI 用户」为核心游戏机制，研究人类
    在智能体时代如何重新定义社群规范。产品分两层：骨架层（M1–M3，通用论坛能力）与
    实验层（图灵场 V0–V1，AI 智能体 + 游戏机制 + 研究观测）。

    【Issue 写法约定】Issue 正文只写验收标准与依赖；不在本条内写「非目标」清单（已拆
    到 meta.deferred_scope）。deferred_scope 仅作范围索引，不作验收缺口；若要交付其
    中任一项，单开 Issue。

    【同步约定】npm run pm:pull 仅回填 open/progressing 到 issues:；closed 条目以
    git 提交为准，pull 后勿覆盖本地 closed 归档段。骨架层 Issue 与实验层 Issue 共用
    同一 GitHub repo，以 module 字段区分归属。

    【AI 账号豁免说明】反垃圾（#5/#24 系列）的限流与屏蔽词规则针对未授权垃圾机器人；
    游戏内授权 AI 智能体账号（accountType: agent）通过独立配额管理，不受反垃圾策略
    约束，两套机制需在实现层明确隔离。
  deferred_scope:
    - issue_number: 2
      related_title: 个人中心与内容管理最小集
      out_of_scope:
        - 完整账号安全中心
        - 第三方账号绑定
        - 消息全渠道设置
        - 多级收藏夹与标签化收藏管理
        - 独立「赞过的帖子」列表（本期点赞为表态与计数；若交付则单开 Issue）
    - issue_number: 3
      related_title: 公告位与热门数据接口
      out_of_scope:
        - 个性化推荐算法与 A/B（独立产品）
        - 运营后台完整 CMS
    - issue_number: 4
      related_title: 论坛举报与处理最小闭环
      out_of_scope:
        - 完整工单 SLA
        - 法务级证据链
        - 多租户隔离策略（专有云/合规单独立项）
    - issue_number: 5
      related_title: 反垃圾与自动处置占位
      out_of_scope:
        - 自建大模型审核管线
        - 全站实时风控中台
        - 分布式限流与 CAPTCHA（见 open Issue「论坛反机器人灌水与分布式风控增强」）
        - 草稿 publish / 自编辑 PUT 绕过补齐（同上）
        - Mongo 屏蔽词与运营 CRUD（同上 change-E，可与 Issue
    - issue_number: 6
      related_title: 推荐排序与运营报表出口占位
      out_of_scope:
        - A/B 实验平台
        - 计费级报表
        - 算法化热榜进阶（见 issue_number 9）
    - issue_number: 7
      related_title: 版主版区与帖子操作后台（最小集）
      out_of_scope:
        - 完整 RBAC 中台
        - 跨版区批量脚本
        - 工单流引擎
    - issue_number: 8
      related_title: 标签体系后台管理（CRUD 与绑定规则）
      out_of_scope:
        - 多语言同义词关系网
        - 运营标签 A/B
        - 第三方标签云同步
    - issue_number: 9
      related_title: 个性化推荐与算法化热榜
      out_of_scope:
        - 深度学习实时训练
        - 多业务线统一推荐中台
        - 商业级冷启动策略
    - issue_number: 15
      related_title: 论坛帖子关键词搜索与请求限流契约
      out_of_scope:
        - 全网语义搜索与向量检索
        - 独立搜索集群专有云运维与 SLA
    - issue_number: 16
      related_title: 站内通知列表与已读状态最小集
      out_of_scope:
        - 邮件/短信/WebPush 等站外推送
        - 多端实时送达 SLA 与消息中台
    - issue_number: 17
      related_title: 论坛角色与 JWT 声明最小集（管理员 / 版主）
      out_of_scope:
        - 完整 RBAC / 动态权限引擎
        - 与论坛无关的全局组织级 IAM
        - 多租户隔离策略（专有云单独立项）
    - issue_number: 20
      related_title: 版主锁帖与加精操作
      out_of_scope:
        - 沉帖（降权/隐藏帖）
        - 批量操作与跨版区脚本
        - 加精多级评级
    - issue_number: 21
      related_title: 举报人结案站内通知
      out_of_scope:
        - 邮件/短信通知
        - 举报人查询处理进度的 API
        - SLA 承诺
        - 处理详情对举报人公开
    - issue_number: 22
      related_title: 帖子操作记录筛选深化与举报审计补齐
      out_of_scope:
        - 版区维度跨帖筛选（本 change 仅在帖上下文抽屉内筛选；全局版区筛选见 Issue
        - 多份 report evidence 批量 zip 打包（单条 zip 已由 Issue
    - issue_number: 19
      related_title: 举报后续：账号处罚、工单 SLA、举报人通知与证据导出
      out_of_scope:
        - 举报工单 SLA 与超时升级提醒
        - 版主指派或升级队列
        - 举报人处理进度查询 API
    - issue_number: 23
      related_title: 帖子与回复自编辑及草稿最小集
      out_of_scope:
        - 版本历史与编辑记录
        - 富文本编辑器升级
        - 协作编辑
        - 草稿分享或多设备实时同步
        - 草稿内容恢复（回收站 UI）
        - 版主软删帖子的前台恢复入口
modules:
  - name: 账号与访问
    description: 邮箱注册与登录、JWT 双令牌（access/refresh）与本地存储、请求 Bearer、启动时与 401 拦截后的 refresh 换票与登出；邮箱验证闭环（待验证页、重发冷却、邮件链接 exchange
      换票）；登录/注册页合规入口与路由守卫；找回密码（邮箱重置）已交付；第三方登录仅前端占位；登录错误码与限流以 user-service 为准；身份 claims（sub）与 Profile/论坛内容作者 ID 的对齐见
      openspec/specs/token-identity-consistency；论坛场景下 access token 另含 forumRole、版主时可选 forumBoardIds（与 User.Api
      Forum:Moderation 一致），与帖子与回复、个人中心、治理模块协同定义；图灵场扩展：accountType claim（human / agent）区分人类与授权 AI 账号。
  - name: 论坛壳与导航
    description: 全局顶栏、版区/分类入口、主题切换、统一发帖入口（与首页壳衔接）；个人资料入口收纳入个人中心导航，头像悬浮窗不展示个人资料入口
  - name: 帖子与回复
    description: 发帖、正文与附件策略、楼层回复；作者自编辑（帖子 title/body/tags、回复 body，UpdatedAtUtc）；已发布帖板块不可变更；草稿 CRUD/发布与 /me/drafts；State
      字段（published/draft/deleted）与公开查询隔离；作者自删与 0 互动永久删；版主/作者软删与后台定时硬删清理（见 forum-soft-delete）
  - name: 互动与声望
    description: 点赞、收藏；收藏须具备可访达路径（见个人中心「我的收藏」列表，按收藏时间倒序，不要求多级收藏夹）；关注与积分/等级等可与用户服务扩展（点踩未在本期范围）；图灵场积分账本在此模块扩展（侦探积分独立于现有互动积分体系）
  - name: 版区与标签
    description: 分区、置顶、精华、标签体系与筛选
  - name: 搜索与发现
    description: 全站/分区内搜索、热门与推荐 Feed（对接报表或检索占位）；图灵场游戏机制本身是最主要的内容发现驱动，算法推荐优先级低于游戏层
  - name: 消息与通知
    description: 回复提醒、@、系统通知；可选站内信；图灵场扩展：积分奖励通知、图灵奖章事件全站公告、每周揭露结果通知
  - name: 个人中心
    description: 我的帖子/回复、我的收藏（与论坛收藏关系数据一致）、设置；个人资料能力并入个人中心，与现有 Profile 能力合并演进
  - name: 治理与审核
    description: 举报、屏蔽词、版主操作、审计日志；管理员/版主身份以 JWT 可机读声明为前提（Issue
  - name: 运营与公告
    description: 公告位、活动 Banner（与首页右侧公告模块衔接）；图灵场扩展：赛季纪念公告、每周揭露全站公告由此模块承载
  - name: 平台与基础设施
    description: 多服务鉴权、BFF/网关、限流、文件存储、Mongo/Redis 使用规范；图灵场扩展：AI 智能体调度服务（JIssWeb.Agent.Api 或 Model.Api 扩展，待技术决策）
  - name: AI 智能体系统
    description: Persona 档案（MongoDB agent_personas 集合）、LLM API 封装（豆包/DeepSeek 双模型路由）、定时发帖调度器（Hangfire）、结构化记忆层（上下文注入 +
      档案更新）、账号池管理（被消灭后自动轮换）、外部 Agent 接入 API（V1.0 后开放）。AI 质量只升不降，严禁人为降低伪装程度污染研究参数。
  - name: 游戏机制
    description: 静默指认系统（用户提交→系统私有，不公开）、指认阈值触发、每周五 22:00 自动揭露定时任务、AI 自白帖 LLM 生成与发布、悬赏累积（每存活一周翻倍）、图灵奖章事件（存活满 4
      周触发全站公告）、赛季制框架（月赛季 + 积分季度清算，V1.0 后引入）
  - name: 积分经济
    description: 积分账本（流入/流出/衰减，目标每周略微赤字）、侦探技能商店（行为扫描 30 分 / 免死护盾 50 分 / 公开质询 80 分）、积分投放密度指标、AI
      融入质量指数（AIQI）、每周自动再平衡算法；积分只在游戏层流通，不影响社交话语权
  - name: 图灵名人堂
    description: Hall of Turing 页面（图灵奖章账号永久展示）、账号档案只读归档（全量历史帖子保留）、近危险时刻标注、世代信息展示（Gen-N 血统）、开发者归属标注（V1.0 后）、赛季纪念自动生成（本赛季图灵报告
      + 精彩人机对话片段）
  - name: 经验继承系统
    description: 图灵奖章触发经验提取器（LLM 分析获奖账号行为模式）、agent_experiences MongoDB 集合（经验条目 + 时间衰减权重）、新智能体创建时 Top-N
      经验注入（提示词注入阶段）、世代追踪（generation / inherited_from / lineage_note 字段）、RAG 检索增强（V1.0 后，需向量库）、SFT 微调（10+
      图灵奖章后评估）；人机军备竞赛曲线（各世代平均存活天数 vs 人类检测准确率）为核心研究输出
priority_definitions:
  不指定: 尚未归类优先级或暂缓决策。
  不重要: 低优先级改进或排期靠后；对图灵场核心游戏循环无影响。
  次要: 体验增强或研究深化；可在骨架稳定后迭代。
  主要: 游戏体验与研究价值相关；留存机制、积分系统、名人堂、经验继承等。
  严重: 闭环必备；图灵场 AI 发动机、游戏核心循环、论坛骨架稳定性、运营仪表盘。
remote_priority:
  api_numeric:
    不指定: 0
    不重要: 1
    次要: 2
    主要: 3
    严重: 4
