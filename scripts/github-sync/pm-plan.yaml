  - title: 版主治理与帖子操作后台持续建设
    body: |
      定位：在 Issue #7 已交付的置顶、审计列表与前端最小集之上，**长期迭代**的版主治理轨道；具体交付以拆分子 Issue / OpenSpec change 为准。
      验收标准（方向性，逐项子 Issue 收紧）：
      - 扩展帖子治理动作（如锁帖、加精/取消精华、沉帖等）中与现有 JWT、`Forum:Moderation:Moderators` 版区范围一致；状态在列表与详情可反映；审计与列表查询可联调。
      - 审计与操作台能力深化：筛选分页、导出或运营视图（择一或多）、与举报进阶（**Issue #19**：处罚、SLA、通知、证据导出）链路的衔接说明或占位。
      - 前端：版主操作台信息架构与可用性随动作增加持续迭代（路由、`forum-moderation-sticky-ui` / `forum-moderation-post-ops` 规范增补）。
      依赖：`openspec/specs/forum-moderation-post-ops`、`openspec/specs/forum-moderation-sticky-ui`、`openspec/specs/token-identity-consistency`（`forumRole`/`forumBoardIds`）、Issue #17 closed、Issue #7 closed；Issue #4 closed；与 **Issue #19** 可并行规划接口边界。
      非目标：完整 RBAC/权限中台、跨租户隔离、工单流引擎（与同里程碑 `meta.deferred_scope` 中 Issue #7 条一致，若交付则单独立项）。
    milestone: M3 — 治理与增长
    issue_number: 18
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 举报后续：账号处罚、工单 SLA、举报人通知与证据导出
    body: |
      **新开需求**，承接 Issue #4 已交付最小闭环之外的治理能力；交付以子 Issue / OpenSpec change 拆分为准。
      验收标准（方向性，逐项收紧）：
      - **账号处罚与 user-service**：与论坛治理联动的账号侧处置（警告、禁言、封禁等择一或多）及与 user-service 的 API/事件契约。
      - **SLA / 指派**：工单级 SLA、指派或升级队列等与 Issue #4「非目标：完整工单 SLA」对齐的独立交付。
      - **举报人通知**：结案或关键节点对举报人的站内通知（或约定渠道），与现有通知模块边界写清。
      - **证据导出**：合规或运营可取证的导出包或等价能力（格式、留存与权限）。
      依赖：Issue #4 closed；`openspec/specs/forum-report-api`；可与 Issue #18 并行规划边界。
      非目标：单条 Issue 一次性打包以上全部能力而不拆规格。
    milestone: M3 — 治理与增长
    issue_number: 19
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 标签体系后台管理（CRUD 与绑定规则）
    body: |
      验收标准：
      - 提供标签的创建、编辑、禁用/合并等最小管理能力（API 或管理端择一），与前台只读词表同源；帖子绑定/解绑规则可文档化或演示。
      - 与论坛帖子 tags 字段及列表筛选行为一致，禁止与硬编码占位词表分裂。
      依赖：论坛版区与标签只读展示与首页对齐（已关闭条目）；forum-homepage-shell 与 forum 内容 API 约定。
      非目标：多语言同义词关系网、运营标签 A/B、第三方标签云同步。
    milestone: M3 — 治理与增长
    issue_number: 8
    priority: 主要
    state: open
    module: 版区与标签
    classification: feature
  - title: 个性化推荐与算法化热榜
    body: |
      验收标准：
      - 在「时间序 / 简易热度」之上，增加可配置的算法化排序或热榜策略至少一种（规则或离线分可接受），与 Feed/侧栏数据合同对齐；可观测指标（曝光、点击等择一）占位或与 report-service 衔接说明。
      - 与 M2「公告位与热门数据接口」、M3「推荐排序与运营报表出口占位」的边界写清：本条负责推荐/热榜算法侧进阶，不重复占位接口验收。
      依赖：论坛帖子与互动数据基础；推荐排序与运营报表出口占位（同里程碑 open Issue，可并行演进）。
      非目标：深度学习实时训练、多业务线统一推荐中台、商业级冷启动策略。
    milestone: M3 — 治理与增长
    issue_number: 9
    priority: 主要
    state: open
