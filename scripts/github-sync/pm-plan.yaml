  - title: 帖子与回复自编辑及草稿最小集
    body: |
      验收标准：
      - 帖子作者可编辑**自己**已发布帖子的标题、正文与 tags（非版主操作），编辑后内容即时生效；非作者尝试编辑收到 403。
      - 回复作者可编辑**自己**已发布回复的正文；非作者尝试编辑收到 403。
      - 草稿：登录用户发帖时可保存草稿（`state: draft`），草稿仅作者可见，可继续编辑后发布；至少支持「我的草稿」列表（可在个人中心子导航追加或单独入口）；浏览器刷新后草稿不丢失（服务端持久化）。
      - 已锁帖（`RepliesLocked: true`）时，回复编辑仍可操作（锁帖只禁止新回复，不影响存量编辑）；已删除帖子/回复不可编辑。
      - 后端：`PUT /api/forum/posts/{postId}`、`PUT /api/forum/posts/{postId}/replies/{replyId}`、`POST /api/forum/posts/drafts`、`GET /api/forum/me/drafts`（分页）；发布草稿复用 `POST /api/forum/posts`（增加 `draftId` 参数消费草稿）或等价设计，方案在 OpenSpec change 中写清。
      - 集成测试覆盖：作者编辑成功、非作者编辑 403、草稿保存与发布、草稿列表分页。
      依赖：`openspec/specs/forum-content-api`（帖子与回复 API 合同）；Issue #2 closed（个人中心，可追加草稿子视图）。
      非目标：版本历史与编辑记录；富文本编辑器升级（可独立 Issue）；协作编辑；草稿分享或多设备同步。
    milestone: M3 — 治理与增长
    issue_number: 23
    priority: 次要
    state: open
    module: 帖子与回复
    classification: feature
