  - title: 版主锁帖与加精操作
    body: |
      验收标准：
      - 锁回复：版主/管理员 `POST /api/mod/posts/{id}/replies-locked`（body: `{ "repliesLocked": bool }`），鉴权与置顶一致；锁帖后禁止新回复，存量回复仍可编辑；列表/详情展示锁帖标记；写审计（post.lockReplies/post.unlockReplies）。
      - 加精：`POST /api/mod/posts/{id}/featured`（body: `{ "isFeatured": bool }`）；`GET /api/forum/posts?featured=true` 精华 feed，按 FeaturedAtUtc 降序；公开 DTO 含 isFeatured。
      - 前端 `ForumPostGovernancePanel` 锁帖/加精按钮；`useForumHomeFeed` 精华 tab 接真实数据；列表卡与详情页精华/锁帖角标。
      - 集成测试：ForumModerationReplyLockTests、ForumFeaturedOperationsTests、ForumPostsFeaturedFeedTests 等。
      依赖：Issue #7 closed（置顶与审计最小集）；Issue #17 closed（forumRole JWT）；父 Issue #18。
