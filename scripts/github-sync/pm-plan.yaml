  - title: 举报人结案站内通知
    body: |
      验收标准：
      - 版主 `PATCH /api/mod/reports/{id}` 将 status 变更为 `resolved` 或 `rejected` 后，向 `ReporterSub` 写入一条 `ReportResolved` 站内通知；`ReportId` sparse unique 幂等，重开再结案不产生重复通知。
      - 通知 ActorSubId 为空（系统行为）；PostTitle 查帖填入，帖已删留空；前端文案「您对《PostTitle》的举报已处理」，深链指向 PostId。
      - 集成测试：ForumReportNotificationTests 覆盖 resolved/rejected/幂等/帖已删等场景。
      依赖：Issue #4 closed（举报数据模型）；Issue #16 closed（站内通知基础设施）；父 Issue #19。
      非目标：邮件/短信通知；举报进度查询 API；SLA 指标；处理结论对举报人公开。
      交付确认：`InAppNotificationTypes.ReportResolved`；`ModReportsController.PatchStatus` 结案副作用；`ForumNotificationsController` ReportResolved 映射；规范见 `openspec/specs/report-resolved-notification` 及 `forum-report-api`、`in-app-notifications` 增量；变更归档 `openspec/changes/archive/2026-05-15-m3-report-resolved-notification/`。
