  - title: 论坛 MVP 核心基础设施与首页 Feed 接入（M1 归档）
    body: |
      验收标准（已全部交付，此条为归档记录）：
      - 多服务骨架（User/Customer/Model/Accounting/Report/Gateway/Frontend.Bff）已按统一 Program.cs 模式启动，含共享异常处理、JWT 验证与 MongoDB 注册。
      - Docker Compose 本地启动 Mongo + Redis 可用，端口与 `.env` 对齐。
      - JWT `sub`/`userId` 一致性约定落地（`openspec/specs/token-identity-consistency`）。
      - 论坛首页壳（Forum Homepage Shell）与首组 API 接入：`GET /api/forum/posts`（分页、板块筛选、tag 筛选）、`GET /api/forum/posts/{id}`（详情与查看计数）、`POST /api/forum/posts`（发帖）、`POST /api/forum/posts/{id}/replies`（回复）。
      - YARP 网关转发规则与 Vite 代理约定已对齐；axios 401 单飞 refresh 已上线。
      - 账号与访问完整闭环：邮箱验证注册、找回密码、auth 页 UX、JWT 双令牌本地存储、路由守卫。
      - 版区与标签只读（`GET /api/forum/tags/popular`）、点赞/收藏基础设施（`forum-post-like-favorite`）已交付。
      已归档变更（`openspec/changes/archive/`）：`2026-04-08-multi-service-skeleton`、`2026-04-08-docker-configuration`、`2026-04-08-jwt-sub-userid-consistency`、`2026-04-08-email-verification-*`、`2026-04-08-auth-page-ux-refresh`、`2026-04-08-yarp-gateway-bff-foundation`、`2026-04-10-add-forum-homepage-skeleton`、`2026-04-11-forum-mvp-api-feed`、`2026-04-11-password-reset-email-flow`、`2026-04-12-axios-401-refresh-retry`、`2026-04-12-forum-post-search`、`2026-04-13-forum-boards-tags-readonly-homepage`、`2026-04-18-post-like-favorite-foundation`。
      依赖：无（起点）。
      非目标：见各归档变更的 proposal.md。
