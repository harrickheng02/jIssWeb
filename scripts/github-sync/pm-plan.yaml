  - title: 版主治理与帖子操作后台持续建设
    body: |
      定位：在 Issue #7 已交付的置顶、审计列表与前端最小集之上，**长期迭代**的版主治理轨道；每期以子 Issue 或 OpenSpec change 为粒度交付。
      已规划子 Issue：
      - Issue #20 版主锁帖与加精操作（当前阶段，依赖已满足）
      后续方向（未单开子 Issue，时序待定）：
      - 审计列表筛选分页深化（按操作类型、版区、时间范围）
      - 审计导出或运营视图（格式与权限边界待设计）
      - 与 Issue #19 举报进阶链路的衔接占位（如「由举报触发的处置」在审计中可查）
      - 前端版主操作台信息架构随动作增加持续迭代
      验收标准（方向性，逐项子 Issue 收紧）：
      - 扩展帖子治理动作与现有 JWT、`Forum:Moderation:Moderators` 版区范围一致；状态在列表与详情可反映；审计与列表查询可联调。
      - 审计与操作台能力深化：筛选分页、导出或运营视图（择一或多）、与举报进阶（**Issue #19**）链路的衔接说明或占位。
      - 前端：版主操作台随动作增加持续迭代（`forum-moderation-sticky-ui` / `forum-moderation-post-ops` 规范增补）。
      依赖：`openspec/specs/forum-moderation-post-ops`、`openspec/specs/forum-moderation-sticky-ui`、`openspec/specs/token-identity-consistency`（`forumRole`/`forumBoardIds`）、Issue #17 closed、Issue #7 closed；Issue #4 closed；与 **Issue #19** 可并行规划接口边界。
      非目标：完整 RBAC/权限中台、跨租户隔离、工单流引擎。
