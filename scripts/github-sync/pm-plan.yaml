meta:
  product: 论坛方向 Web 应用
  scope_note: |
    Issue 正文只写验收标准与依赖；不在本条内写「非目标」清单（已拆到 `meta.deferred_scope`）。
    `deferred_scope` 仅作范围索引，不作验收缺口；若要交付其中任一项，单开 Issue。
  deferred_scope:
    - issue_number: 2
      related_title: 个人中心与内容管理最小集
      out_of_scope:
        - 完整账号安全中心
        - 第三方账号绑定
        - 消息全渠道设置
        - 多级收藏夹与标签化收藏管理
        - 独立「赞过的帖子」列表（本期点赞为表态与计数；若交付则单开 Issue）
    - issue_number: 3
      related_title: 公告位与热门数据接口
      out_of_scope:
        - 个性化推荐算法与 A/B（独立产品）
        - 运营后台完整 CMS
    - issue_number: 4
      related_title: 论坛举报与处理最小闭环
      out_of_scope:
        - 完整工单 SLA
        - 法务级证据链
        - 多租户隔离策略（专有云/合规单独立项）
    - issue_number: 5
      related_title: 反垃圾与自动处置占位
      out_of_scope:
        - 自建大模型审核管线
        - 全站实时风控中台
    - issue_number: 6
      related_title: 推荐排序与运营报表出口占位
      out_of_scope:
        - A/B 实验平台
        - 计费级报表
        - 算法化热榜进阶（见 issue_number 9）
    - issue_number: 7
      related_title: 版主版区与帖子操作后台（最小集）
      out_of_scope:
        - 完整 RBAC 中台
        - 跨版区批量脚本
        - 工单流引擎
    - issue_number: 8
      related_title: 标签体系后台管理（CRUD 与绑定规则）
      out_of_scope:
        - 多语言同义词关系网
        - 运营标签 A/B
        - 第三方标签云同步
    - issue_number: 9
      related_title: 个性化推荐与算法化热榜
      out_of_scope:
        - 深度学习实时训练
        - 多业务线统一推荐中台
        - 商业级冷启动策略
    - issue_number: 15
      related_title: 论坛帖子关键词搜索与请求限流契约
      out_of_scope:
        - 全网语义搜索与向量检索
        - 独立搜索集群专有云运维与 SLA
    - issue_number: 16
      related_title: 站内通知列表与已读状态最小集
      out_of_scope:
        - 邮件/短信/WebPush 等站外推送
        - 多端实时送达 SLA 与消息中台
    - issue_number: 17
      related_title: 论坛角色与 JWT 声明最小集（管理员 / 版主）
      out_of_scope:
        - 完整 RBAC / 动态权限引擎
        - 与论坛无关的全局组织级 IAM
        - 多租户隔离策略（专有云单独立项）
modules:
  - name: 账号与访问
    description: 邮箱注册与登录、JWT 双令牌（access/refresh）与本地存储、请求 Bearer、启动时与 401 拦截后的 refresh 换票与登出；邮箱验证闭环（待验证页、重发冷却、邮件链接 exchange
      换票）；登录/注册页合规入口与路由守卫；找回密码（邮箱重置）已交付；第三方登录仅前端占位；登录错误码与限流以 user-service 为准；身份 claims（sub）与 Profile/论坛内容作者 ID 的对齐见
      openspec/specs/token-identity-consistency；论坛场景下 access token 另含 `forumRole`、版主时可选 `forumBoardIds`（与 User.Api `Forum:Moderation` 一致），与帖子与回复、个人中心、治理模块协同定义。
  - name: 论坛壳与导航
    description: 全局顶栏、版区/分类入口、主题切换、统一发帖入口（与首页壳衔接）；个人资料入口收纳入个人中心导航，头像悬浮窗不展示个人资料入口
  - name: 帖子与回复
    description: 发帖、正文与附件策略、楼层回复、编辑删除、草稿
  - name: 互动与声望
    description: 点赞、收藏；收藏须具备可访达路径（见个人中心「我的收藏」列表，按收藏时间倒序，不要求多级收藏夹）；关注与积分/等级等可与用户服务扩展（点踩未在本期范围）
  - name: 版区与标签
    description: 分区、置顶、精华、标签体系与筛选
  - name: 搜索与发现
    description: 全站/分区内搜索、热门与推荐 Feed（对接报表或检索占位）
  - name: 消息与通知
    description: 回复提醒、@、系统通知；可选站内信
  - name: 个人中心
    description: 我的帖子/回复、我的收藏（与论坛收藏关系数据一致）、设置；个人资料能力并入个人中心，与现有 Profile 能力合并演进
  - name: 治理与审核
    description: 举报、屏蔽词、版主操作、审计日志；管理员/版主身份以 JWT 可机读声明为前提（Issue #17、`openspec/specs/token-identity-consistency`）。版主版区范围由 access token 内 `forumBoardIds`（User.Api 按 `Forum:Moderation` 签发，非空时写入）与 Model.Api 校验/兜底配置一致。版主置顶与操作记录最小集已交付（Issue #7 closed）；举报最小闭环（Issue #4 closed）；操作台持续建设见 Issue #18；**举报后续（处罚、SLA、举报人通知、证据导出）见 Issue #19**。
  - name: 运营与公告
    description: 公告位、活动 Banner（与首页右侧公告模块衔接）
  - name: 平台与基础设施
    description: 多服务鉴权、BFF/网关、限流、文件存储、Mongo/Redis 使用规范
priority_definitions:
  不指定: 尚未归类优先级或暂缓决策。
  不重要: 低优先级改进或排期靠后。
  次要: 规模与合规、非核心路径或体验增强；可延后。
  主要: 留存与活跃相关；搜索、通知、互动基础等。
  严重: 闭环必备；账号与访问、帖子与回复最小闭环、论坛壳与导航、个人中心基础等。
remote_priority:
  api_numeric:
    不指定: 0
    不重要: 1
    次要: 2
    主要: 3
    严重: 4
issue_content_classifications:
  - bug
  - duplicate
  - enhancement
  - feature
  - invalid
  - question
  - wontfix
milestones:
  - title: M1 — 可演示论坛 MVP
    description: 用户服务真实登录与 JWT；论坛首组 API；Feed/帖子页接数据；分类与标签只读
    due_on: 2026-06-30
  - title: M2 — 互动与发现
    description: 点赞收藏、通知、搜索；个人中心与内容管理；公告与热门接口
    due_on: 2026-09-30
  - title: M3 — 治理与增长
    description: 论坛角色与 JWT 声明最小集（管理员/版主）为先；审核举报、反垃圾占位；版主操作；推荐排序；运营与报表
    due_on: 2026-12-31
  - title: W — 工作流程与工程效能
    description: 与 M1–M3 产品交付解耦：策划案入库、审阅门禁、路由与路径校验、CI/hooks、复盘与图谱刷新；排期与业务里程碑独立叙述。
    due_on: 2026-12-31
issues:
  - title: 公告位与热门数据接口
    body: |
      验收标准：
      - 公告：提供至少一种可读公告数据源（静态配置、CMS 占位或 API），与首页/论坛壳右侧公告模块字段约定一致并可空态展示。
      - 热门：提供榜单或热门帖子列表接口（可由 Model/BFF/报表占位），与首页「热门」区块对齐；分页或条数上限有约定。
      - 鉴权边界（公开只读 vs 管理端）在文档或代码中可核验。
      依赖：openspec/specs/forum-homepage-shell/spec.md（若含侧栏）；里程碑 M2 描述。
      非目标：推荐算法、A/B、运营后台完整 CMS。
      落地：`GET /api/forum/announcements`（Mongo `forum_announcements`）；`GET /api/forum/posts?sort=hot`；首页右栏与 `forum-content-api` / `forum-homepage-shell` 规范对齐；侧栏热门请求 `page=1`、`pageSize=8`（见 `forum-homepage-shell`）。
      交付确认：Model.Api 与前端首页右栏已接入；规范已合并 `openspec/specs/**`；变更已归档 `openspec/changes/archive/2026-04-20-m2-forum-announcements-hot-read-api/`。
    milestone: M2 — 互动与发现
    issue_number: 3
    priority: 次要
    state: closed
    module: 运营与公告
    classification: feature
  - title: 论坛帖子关键词搜索与请求限流契约
    body: |
      验收标准：
      - `GET /api/forum/posts` 支持 `q` 关键词筛选与分页，列表摘要与非搜索列表合同一致；空或仅空白 `q` 按规范拒绝或等价处理。
      - 带非空 `q` 的请求限流可配置，超限返回 429。
      依赖：`openspec/specs/forum-post-search/spec.md`；`openspec/specs/token-identity-consistency`。
      非目标：全网语义搜索与向量检索；独立搜索集群专有云运维与 SLA。
      实现边界（后续治理项）：
      - 反代/多跳代理场景下 `X-Forwarded-For` 的可信采信策略（建议引入可信代理配置/统一中间件处理）。
      - 多实例部署的分布式限流（当前为进程内桶，重启/扩容会重置窗口）。
    milestone: M2 — 互动与发现
    issue_number: 15
    priority: 主要
    state: closed
    module: 搜索与发现
    classification: feature
  - title: 个人中心与内容管理最小集
    body: |
      验收标准：
      - 已登录用户可访问个人中心（`/me` 路由），子导航含「我的帖子」「我的回复」「我的收藏」「设置」，各列表分页与三态（加载中/空态/失败）可演示。
      - `GET /api/forum/me/favorites` 已在 Model API 暴露，与 `forum-post-like-favorite` 规范一致；未登录返回 401；删帖后收藏列表不含该帖。
      - 顶栏用户菜单含「个人中心」入口；与现有 Profile 路由、登录/退出无冲突。
      依赖：openspec/specs/forum-personal-center/spec.md；openspec/specs/forum-post-like-favorite；openspec/specs/token-identity-consistency。
      非目标：完整账号安全中心；第三方账号绑定；消息全渠道设置；多级收藏夹与标签化收藏管理；独立「赞过的帖子」列表。
      交付确认：前端 `/me` 路由、子视图与 HeaderUserMenu 入口；ForumMeController favorites 端点与集成测试已交付；规范见 `openspec/specs/forum-personal-center`；变更归档 `openspec/changes/archive/2026-04-19-m2-forum-personal-center-minimal/`。
    milestone: M2 — 互动与发现
    issue_number: 2
    priority: 严重
    state: closed
    module: 个人中心
    classification: feature
  - title: 站内通知列表与已读状态最小集
    body: |
      验收标准：
      - 他人回复我的帖子时，通知列表出现 `ReplyToPost` 类型通知，含 `PostId`、`ReplyId`、`ActorId`；自回复不产生通知。
      - 通知列表支持分页、未读筛选；已读操作幂等（首次已读时间不被覆盖）；未读数可在入口处查看。
      - 通知项深链可跳转至帖子详情并定位对应回复；找不到时回退顶部并展示占位提示。
      依赖：openspec/specs/m2-in-app-notifications-minimal/spec.md；openspec/specs/in-app-notifications/spec.md；openspec/specs/token-identity-consistency。
      非目标：邮件/短信/WebPush 等站外推送；多端实时送达 SLA 与消息中台。
      交付确认：Model.Api 通知控制器、回复触发通知写入与幂等唯一索引（`ReplyId`）；前端通知列表页、未读数展示与深链跳转；集成测试覆盖（回复触发、自回复不通知、已读幂等）。规范见 `openspec/specs/m2-in-app-notifications-minimal`、`openspec/specs/in-app-notifications`；变更归档 `openspec/changes/archive/2026-04-19-m2-in-app-notifications-minimal/`。
    milestone: M2 — 互动与发现
    issue_number: 16
    priority: 主要
    state: closed
    module: 消息与通知
    classification: feature
  - title: 论坛角色与 JWT 声明最小集（管理员 / 版主）
    body: |
      验收标准：
      - access token（或文档约定的等价载体）中包含与 `sub` 一并可校验的**论坛角色**信息：至少能区分普通用户、版主、管理员中的一种组合策略（claim 名称、取值与解析规则写在 OpenSpec 增量或 `openspec/specs/token-identity-consistency` 中）。
      - Model.Api 对「仅版主/仅管理员」可调用的路由（或占位路由）能一致拒绝未授权请求，错误码与统一错误合同一致；只读公开接口行为不变。
      - 提供**手工验收说明**：测试账号或换票路径如何得到各角色 token；便于治理类 Issue 对照验收。
      设计拆解（建议交付顺序）：
      - ① OpenSpec：角色枚举与 claim 约定、与现有 `sub` 关系。
      - ② user-service：签发含角色的 JWT（或配置/种子用户映射）。
      - ③ Model.Api：鉴权策略或过滤器读取 claim。
      - ④ 与 Issue #4、#7 联调（举报队列、版主操作）。
      依赖：`openspec/specs/token-identity-consistency`；user-service JWT 签发与本地配置约定。
      非目标：完整 RBAC 中台、动态权限引擎、按资源的细粒度 ACL；跨服务统一权限平台。
    milestone: M3 — 治理与增长
    issue_number: 17
    priority: 主要
    state: closed
    module: 治理与审核
    classification: feature
  - title: 论坛举报与处理最小闭环
    body: |
      验收标准：
      - 用户可对帖子或回复发起举报并产生可查询记录；处理侧至少具备列表查看或状态流转占位，行为可演示。
      - 与鉴权、审计字段约定一致（操作者、目标资源标识）。
      依赖：里程碑 M3；Issue #17（论坛角色与 JWT 声明最小集，处理侧须能识别管理员/版主身份）；openspec 治理相关条款（若有）。
      非目标：完整工单 SLA、法务级证据链、多租户隔离策略。
      交付与归档：`openspec/specs/forum-report-api`、`forum-report-moderation-ui`、`forum-moderation-delete-content`；OpenSpec 归档 `openspec/changes/archive/2026-05-07-forum-report-minimal-closed-loop/`、`openspec/changes/archive/2026-05-07-forum-report-governance-full/`；手工验收见各归档目录 **`manual-qa.md`**。**账号处罚与 user-service、工单 SLA/指派、举报人通知、证据导出** 不在本条验收内，见 **新开 Issue #19**。
    milestone: M3 — 治理与增长
    issue_number: 4
    priority: 主要
    state: closed
    module: 治理与审核
    classification: feature
  - title: 反垃圾与自动处置占位
    body: |
      验收标准：
      - 在文档或配置层定义反垃圾策略占位（关键词、频率、人机挑战接入点等择一），与发帖/回复链路的挂钩方式可说明。
      - 与现有 user-service / Model 限流能力可复用处有对照说明。
      依赖：里程碑 M3。
      非目标：自建大模型审核、全站实时风控中台。
    milestone: M3 — 治理与增长
    issue_number: 5
    priority: 次要
    state: open
    module: 治理与审核
    classification: enhancement
  - title: 推荐排序与运营报表出口占位
    body: |
      验收标准：
      - 列表或 Feed 可切换「时间序 / 简易热度」等占位策略之一，查询参数、默认值与回退行为文档化或可联调。
      - 报表或 BFF 提供至少一种只读运营指标出口（与现有 report-service 或占位路由对齐）；失败与空数据可处理。
      依赖：openspec/specs/report-service（若适用）；里程碑 M3。
      非目标：A/B 实验平台、计费级报表；个性化与算法化热榜见同里程碑 Issue「个性化推荐与算法化热榜」。
    milestone: M3 — 治理与增长
    issue_number: 6
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 版主版区与帖子操作后台（最小集）
    body: |
      验收标准：
      - 具备版主或管理员角色边界（与 JWT/角色声明一致）；可对帖子执行至少一种版区操作（如置顶、精华、锁帖或等价）并持久化，列表与详情可反映状态。
      - 操作审计字段可核验（操作者 sub、目标帖子、时间）；非法或未授权请求有明确错误码。
      依赖：Issue #17（论坛角色与 JWT 声明最小集，本 Issue 依赖可机读角色）；论坛领域首组 API 与版区数据模型；openspec/specs/token-identity-consistency。
      非目标：完整 RBAC 中台、跨版区批量脚本、工单流。
      交付确认（最小集范围）：
      - 后端：Model.Api `POST /api/mod/posts/{postId}/sticky`；`GET /api/mod/audit`（版主按帖/版区授权，删帖后依审计元数据 `boardId`/`board` 判权）；审计元数据含 `board`、`boardId`（由 `Forum:Boards` 解析）；网关转发 `/api/mod/**` 至 model-service；User.Api JWT 含 `forumRole`；版主版区由 `Forum:Moderation:Moderators` 与 token 内 `forumBoardIds` 对齐（见 `openspec/specs/token-identity-consistency`）。搜索带 `q` 时列表排序不按置顶插队（与 `forum-post-search` 一致）。
      - 前端：帖子详情置顶操作、操作记录（人读 `actionLabel` + 昵称）、版主导航与治理说明入口；规范见 `openspec/specs/forum-moderation-post-ops`、`openspec/specs/forum-moderation-sticky-ui`。
      - 测试：`JIssWeb.Model.Api.Tests` 集成测试覆盖版主范围、删帖后审计、旧审计仅 `board` 等路径。
      - 手工验收：`openspec/changes/archive/2026-04-20-frontend-moderation-sticky-ui-minset/manual-qa.md`（仅此路径；已移除重复的 `openspec/changes/frontend-moderation-sticky-ui-minset/`）。
      - OpenSpec 归档参考：`openspec/changes/archive/2026-04-20-m3-moderation-post-sticky-minset/`、`2026-04-20-frontend-moderation-sticky-ui-minset/`、`2026-04-20-forum-jwt-role-claims/`。
      后续大块能力见新开 Issue「版主治理与帖子操作后台持续建设」（本仓库 pm-plan `issue_number: 18`）。
    milestone: M3 — 治理与增长
