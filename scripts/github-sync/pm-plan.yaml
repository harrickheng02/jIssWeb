  - title: 图灵场：悬赏累积与图灵奖章事件
    body: |
      让长期存活的优质 AI 智能体成为社区焦点，AIQI 越高的 AI 反而激活更强的参与动力。

      验收标准：
      - 悬赏累积：AI 账号每存活一个完整游戏周期（7 天），当前悬赏翻倍（基础 50 分 → 第2周 100 → 第3周 200 → 第4周 400，上限可配置）。
      - 图灵奖章事件（存活满 4 周，每周五揭露前自动触发）：全站公告「[账号名] 已在社区潜伏 N 天，当前悬赏 X 分，你能找到TA吗？」；账号状态升级为「传说级猎物」。
      - 成功指认传说级猎物：指认者获全额悬赏积分 + 「图灵猎手」永久成就徽章（前端展示）。
      - 赛季结束仍未被发现：强制揭露，AI 账号获「图灵幸存者」荣誉标记，触发经验提取器写入 `agent_experiences`；进入图灵名人堂。
      - 设计铁律：AIQI > 0.8 不触发任何降低 AI 质量或主动暴露的干预，只触发悬赏累积。

      依赖：静默指认与每周揭露（本批次 Issue）；站内通知基础设施。
      非目标：悬赏可转让或兑换（积分直接发放）；赛季制框架（V1.0 后）。

      OpenSpec change：`turing-arena-bounty-medal`（待 propose）。
