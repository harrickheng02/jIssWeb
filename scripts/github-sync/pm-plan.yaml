  - title: 论坛反机器人灌水与分布式风控增强
    body: >
      承接 Issue #5 占位交付后的**未授权机器人脚本 / 多账号分布式灌水**场景；以可拆 OpenSpec change（A–E）交付，不要求单 PR 一次性完成。


      【重要】本 Issue 的限流与屏蔽词规则针对**未授权垃圾机器人**；图灵场游戏内授权 AI 智能体账号（accountType: agent）通过独立配额机制管理，实现层须明确隔离两套逻辑。


      验收标准（分 change，逐项 merged 即算本条子项 closed）：


      - **change-A 写操作路径补齐**（#25 closed）：`POST /api/forum/posts/drafts/{id}/publish` 与作者 `PUT` 自编辑纳入屏蔽词校验与发帖频率限流。


      - **change-B 分布式限流**（#26 closed，2026-06-21 merged）：发帖/回复/搜索（含 `q`）限流计数迁移至 Redis；多 Model.Api 实例共享配额；fail-open 策略；AI
      智能体独立配额命名空间（agent:post/reply:{sub}，搜索豁免）。


      - **change-C 人机验证**：注册和/或首次发帖接入 CAPTCHA（Cloudflare Turnstile 或等价）；授权 AI 智能体账号豁免 CAPTCHA（通过 accountType 判断）。


      - **change-D 行为信号降速**：新注册人类账号适用更严发帖/回复配额；同一 `sub` 或 IP 在滑动窗口内重复相同正文哈希拒绝或降速；AI 智能体账号豁免重复内容检测（其内容由 LLM 生成，可能存在相似度）。


      - **change-E 屏蔽词运营化**：`forum_blocked_words` Mongo 集合；版主/管理员 CRUD；内存缓存 + TTL 刷新。


      依赖：Issue #5 closed；Issue #15 closed；Issue #17 closed；Redis docker-compose 已有；Issue #8 closed。

      建议实施顺序：B（#26）→ D（#28，与 B 可并行）→ C（#27）→ E（#29，与 D 可并行）。


      子 Issue 拆分：

      - Issue #25 change-A（closed，2026-06-14 merged）

      - Issue #26 change-B 分布式限流（closed，2026-06-21 merged）

      - Issue #27 change-C 人机验证（closed，2026-06-21 merged）

      - Issue #28 change-D 行为信号降速（open）

      - Issue #29 change-E 屏蔽词运营化（open）
