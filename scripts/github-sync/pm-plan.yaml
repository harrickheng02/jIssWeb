meta:
  product: 论坛方向 Web 应用
  scope_note: |
    Issue 正文只写验收标准与依赖；不在本条内写「非目标」清单（已拆到 `meta.deferred_scope`）。
    `deferred_scope` 仅作范围索引，不作验收缺口；若要交付其中任一项，单开 Issue。
  deferred_scope:
    - issue_number: 2
      related_title: 个人中心与内容管理最小集
      out_of_scope:
        - 完整账号安全中心
        - 第三方账号绑定
        - 消息全渠道设置
        - 多级收藏夹与标签化收藏管理
        - 独立「赞过的帖子」列表（本期点赞为表态与计数；若交付则单开 Issue）
    - issue_number: 3
      related_title: 公告位与热门数据接口
      out_of_scope:
        - 个性化推荐算法与 A/B（独立产品）
        - 运营后台完整 CMS
    - issue_number: 4
      related_title: 论坛举报与处理最小闭环
      out_of_scope:
        - 完整工单 SLA
        - 法务级证据链
        - 多租户隔离策略（专有云/合规单独立项）
    - issue_number: 5
      related_title: 反垃圾与自动处置占位
      out_of_scope:
        - 自建大模型审核管线
        - 全站实时风控中台
    - issue_number: 6
      related_title: 推荐排序与运营报表出口占位
      out_of_scope:
        - A/B 实验平台
        - 计费级报表
        - 算法化热榜进阶（见 issue_number 9）
    - issue_number: 7
      related_title: 版主版区与帖子操作后台（最小集）
      out_of_scope:
        - 完整 RBAC 中台
        - 跨版区批量脚本
        - 工单流引擎
    - issue_number: 8
      related_title: 标签体系后台管理（CRUD 与绑定规则）
      out_of_scope:
        - 多语言同义词关系网
        - 运营标签 A/B
        - 第三方标签云同步
    - issue_number: 9
      related_title: 个性化推荐与算法化热榜
      out_of_scope:
        - 深度学习实时训练
        - 多业务线统一推荐中台
        - 商业级冷启动策略
    - issue_number: 15
      related_title: 论坛帖子关键词搜索与请求限流契约
      out_of_scope:
        - 全网语义搜索与向量检索
        - 独立搜索集群专有云运维与 SLA
    - issue_number: 16
      related_title: 站内通知列表与已读状态最小集
      out_of_scope:
        - 邮件/短信/WebPush 等站外推送
        - 多端实时送达 SLA 与消息中台
    - issue_number: 17
      related_title: 论坛角色与 JWT 声明最小集（管理员 / 版主）
      out_of_scope:
        - 完整 RBAC / 动态权限引擎
        - 与论坛无关的全局组织级 IAM
        - 多租户隔离策略（专有云单独立项）
    - issue_number: 20
      related_title: 版主锁帖与加精操作
      out_of_scope:
        - 沉帖（降权/隐藏帖）
        - 批量操作与跨版区脚本
        - 加精多级评级
    - issue_number: 21
      related_title: 举报人结案站内通知
      out_of_scope:
        - 邮件/短信通知
        - 举报人查询处理进度的 API
        - SLA 承诺
        - 处理详情对举报人公开
    - issue_number: 22
      related_title: 帖子操作记录筛选深化与举报审计补齐
      out_of_scope:
        - 不绑定帖子的全局审计 feed 独立页（后续按运营反馈单开）
        - 审计 CSV/zip 批量导出（Issue #18 后续；单 report 证据 zip 已由 Issue #19 change-C 交付）
        - 版区维度跨帖筛选（本 change 仅在帖上下文抽屉内筛选）
    - issue_number: 19
      related_title: 举报后续：账号处罚、工单 SLA、举报人通知与证据导出
      out_of_scope:
        - 举报工单 SLA 与超时升级提醒
        - 版主指派或升级队列
        - 举报人处理进度查询 API
    - issue_number: 23
      related_title: 帖子与回复自编辑及草稿最小集
      out_of_scope:
        - 版本历史与编辑记录
        - 富文本编辑器升级
        - 协作编辑
        - 草稿分享或多设备实时同步
        - 草稿内容恢复（回收站 UI）
        - 版主软删帖子的前台恢复入口
modules:
  - name: 账号与访问
    description: 邮箱注册与登录、JWT 双令牌（access/refresh）与本地存储、请求 Bearer、启动时与 401 拦截后的 refresh 换票与登出；邮箱验证闭环（待验证页、重发冷却、邮件链接 exchange
      换票）；登录/注册页合规入口与路由守卫；找回密码（邮箱重置）已交付；第三方登录仅前端占位；登录错误码与限流以 user-service 为准；身份 claims（sub）与 Profile/论坛内容作者 ID 的对齐见
      openspec/specs/token-identity-consistency；论坛场景下 access token 另含 `forumRole`、版主时可选 `forumBoardIds`（与 User.Api
      `Forum:Moderation` 一致），与帖子与回复、个人中心、治理模块协同定义。
  - name: 论坛壳与导航
    description: 全局顶栏、版区/分类入口、主题切换、统一发帖入口（与首页壳衔接）；个人资料入口收纳入个人中心导航，头像悬浮窗不展示个人资料入口
  - name: 帖子与回复
    description: 发帖、正文与附件策略、楼层回复；作者自编辑（帖子 title/body/tags、回复 body，UpdatedAtUtc）；已发布帖板块不可变更；草稿 CRUD/发布与 `/me/drafts`；State 字段（published/draft/deleted）与公开查询隔离；作者自删与 0 互动永久删；版主/作者软删与后台定时硬删清理（见 forum-soft-delete）
  - name: 互动与声望
    description: 点赞、收藏；收藏须具备可访达路径（见个人中心「我的收藏」列表，按收藏时间倒序，不要求多级收藏夹）；关注与积分/等级等可与用户服务扩展（点踩未在本期范围）
  - name: 版区与标签
    description: 分区、置顶、精华、标签体系与筛选
  - name: 搜索与发现
    description: 全站/分区内搜索、热门与推荐 Feed（对接报表或检索占位）
  - name: 消息与通知
    description: 回复提醒、@、系统通知；可选站内信
  - name: 个人中心
    description: 我的帖子/回复、我的收藏（与论坛收藏关系数据一致）、设置；个人资料能力并入个人中心，与现有 Profile 能力合并演进
  - name: 治理与审核
    description: 举报、屏蔽词、版主操作、审计日志；管理员/版主身份以 JWT 可机读声明为前提（Issue #17、`openspec/specs/token-identity-consistency`）；版主版区范围由 `forumBoardIds` 签发；举报最小闭环（Issue #4 closed）；锁帖与加精（Issue #20 closed）；帖操作记录筛选与举报审计（Issue #22 closed）；操作台持续建设见 Issue #18；举报进阶首期（Issue #19 closed，含处罚/通知/审计/证据 zip）；举报 SLA / 指派 defer 见 `meta.deferred_scope` issue_number 19。
  - name: 运营与公告
    description: 公告位、活动 Banner（与首页右侧公告模块衔接）
  - name: 平台与基础设施
    description: 多服务鉴权、BFF/网关、限流、文件存储、Mongo/Redis 使用规范
priority_definitions:
  不指定: 尚未归类优先级或暂缓决策。
  不重要: 低优先级改进或排期靠后。
  次要: 规模与合规、非核心路径或体验增强；可延后。
  主要: 留存与活跃相关；搜索、通知、互动基础等。
  严重: 闭环必备；账号与访问、帖子与回复最小闭环、论坛壳与导航、个人中心基础等。
remote_priority:
  api_numeric:
    不指定: 0
    不重要: 1
    次要: 2
    主要: 3
    严重: 4
issue_content_classifications:
  - bug
  - duplicate
  - enhancement
  - feature
  - invalid
  - question
  - wontfix
milestones:
  - title: M1 — 可演示论坛 MVP
    description: 用户服务真实登录与 JWT；论坛首组 API；Feed/帖子页接数据；分类与标签只读
    due_on: 2026-06-30
  - title: M2 — 互动与发现
    description: 点赞收藏、通知、搜索；个人中心与内容管理；公告与热门接口
    due_on: 2026-09-30
  - title: M3 — 治理与增长
    description: 审核举报、反垃圾占位；推荐排序；运营与报表
    due_on: 2026-12-31
  - title: W — 工作流程与工程效能
    description: 与 M1–M3 产品交付解耦：策划案入库、审阅门禁、路由与路径校验、CI/hooks、复盘与图谱刷新；排期与业务里程碑独立叙述。
    due_on: 2026-12-31
issues:
  - title: 反垃圾与自动处置占位
    body: >
      验收标准：

      - **屏蔽词过滤**：`appsettings`（或等价配置）提供屏蔽词配置结构（词表来源：静态列表、文件路径或 Mongo 集合择一），与 `POST /api/forum/posts`、`POST
      /api/forum/posts/{id}/replies` 发帖/回复链路有明确挂钩点（中间件或 service 层钩子）；词表可为空（零配置时行为与无过滤一致）；命中时返回 400 并附错误说明字段。

      - **发帖频率限流**：复用 Issue #15 已交付的限流基础设施（`InProcessRateLimiter` 或等价），为发帖接口设置可配置的独立限流策略（与搜索限流配置隔离）；超限返回 429。

      - 以上两项配置键、默认值与单行示例写入 `appsettings.Local.example.json` 注释，便于本地调试与 CR 验证。

      依赖：Issue #15 closed（限流基础设施）；`JIssWeb.Model.Api` 帖子与回复控制器。

      非目标：自建大模型审核、全站实时风控中台；CAPTCHA/人机挑战集成；分布式限流（见 Issue #15 后续治理项）；屏蔽词管理 UI（可在 Issue #8 标签后台后续扩展）。
    milestone: M3 — 治理与增长
    issue_number: 5
    priority: 次要
    state: open
    module: 治理与审核
    classification: enhancement
  - title: 推荐排序与运营报表出口占位
    body: >
      验收标准：

      - **排序策略**：`GET /api/forum/posts` 支持 `sort` 查询参数（至少 `latest`/`hot` 两种），`hot`
      以回复数或点赞数的简单权重排序（权重公式与默认值写在代码注释或规范增量中）；默认值与空参数回退行为写清；与搜索 `q` 参数共存时排序行为可联调。

      - **运营指标出口**：`JIssWeb.Report.Api`（或 BFF 占位路由）提供至少一个只读端点，返回指定时间段内帖子数/活跃用户数/回复数之一（字段与时间粒度在规范中定义）；无数据时返回空集合而非
      500；鉴权边界（公开只读 vs 管理端）写清。

      依赖：`GET /api/forum/posts` 现有分页合同（`openspec/specs/forum-content-api`）；`openspec/specs/report-service`（若适用）。

      非目标：A/B 实验平台、计费级报表；个性化与算法化热榜（见 Issue #9，本条只做规则热度）；实时大屏。
    milestone: M3 — 治理与增长
    issue_number: 6
    priority: 次要
    state: open
    module: 平台与基础设施
    classification: enhancement
  - title: 标签体系后台管理（CRUD 与绑定规则）
    body: |
      验收标准：
      - 提供标签的创建、编辑、禁用等管理能力（版主及以上），与前台只读词表同源；发帖混合模式（hybrid）下自由标签可用，已注册标签 UseCount 自动维护。
      - 与论坛帖子 tags 字段及列表筛选行为一致，禁止与硬编码占位词表分裂。
      - `GET /api/forum/tags/popular` 与 `GET /api/forum/tags/suggest` 数据源切换为 `forum_tags` 注册表。
      依赖：论坛版区与标签只读展示与首页对齐（已关闭条目）；forum-homepage-shell 与 forum 内容 API 约定；Issue #17 closed（forumRole JWT 声明）。
      非目标：多语言同义词关系网、运营标签 A/B、第三方标签云同步。
      交付确认：`forum_tags` MongoDB 集合（Slug 唯一索引）；`AdminTagsController`（版主+管理员权限，CRUD + disable/enable）；`ForumTagsController` popular/suggest 接口数据源切换；发帖 UseCount +1 / 删帖 UseCount -1；前端 `AdminTagsView.vue`（治理页入口）；发帖建议下拉接入 suggest API；18 个初始标签自动 seed；规范见 `openspec/specs/forum-tag-registry`、`openspec/specs/forum-tag-admin-api`、`openspec/specs/forum-tag-admin-ui`；变更归档 `openspec/changes/archive/2026-05-25-forum-tag-registry/`。
    milestone: M3 — 治理与增长
    issue_number: 8
    priority: 主要
    state: closed
    module: 版区与标签
    classification: feature
  - title: 个性化推荐与算法化热榜
    body: |
      验收标准：
      - 在「时间序 / 简易热度」之上，增加可配置的算法化排序或热榜策略至少一种（规则或离线分可接受），与 Feed/侧栏数据合同对齐；可观测指标（曝光、点击等择一）占位或与 report-service 衔接说明。
      - 与 M2「公告位与热门数据接口」、M3「推荐排序与运营报表出口占位」的边界写清：本条负责推荐/热榜算法侧进阶，不重复占位接口验收。
      依赖：论坛帖子与互动数据基础；推荐排序与运营报表出口占位（同里程碑 open Issue，可并行演进）。
      非目标：深度学习实时训练、多业务线统一推荐中台、商业级冷启动策略。
    milestone: M3 — 治理与增长
    issue_number: 9
    priority: 主要
    state: open
    module: 搜索与发现
    classification: feature
  - title: 版主治理与帖子操作后台持续建设
    body: |
      定位：在 Issue #7 已交付的置顶、审计列表与前端最小集之上，**长期迭代**的版主治理轨道；每期以子 Issue 或 OpenSpec change 为粒度交付。
      已交付子 Issue / change：
      - Issue #20 版主锁帖与加精操作（closed）
      - Issue #22 帖子操作记录筛选深化与举报审计补齐（closed）
      - **forum-moderation-audit-global-feed**（merged）：全局审计 feed、CSV 导出、治理工作台 Tab（审计动态｜举报队列｜标签管理）；规范见 `openspec/specs/forum-moderation-audit-feed`、`openspec/specs/forum-moderation-sticky-ui` 增量；变更归档 `openspec/changes/archive/2026-06-02-forum-moderation-audit-global-feed/`。
      后续方向（时序待定）：
      - 前端版主操作台信息架构随动作增加持续迭代（完整 layout 仍 defer）
      验收标准（方向性，逐项子 Issue 收紧）：
      - 扩展帖子治理动作与现有 JWT、`Forum:Moderation:Moderators` 版区范围一致；状态在列表与详情可反映；审计与列表查询可联调。
      - 审计与操作台能力深化：筛选分页、导出或运营视图（择一或多）、与举报进阶（**Issue #19**）链路的衔接说明或占位。
      - 前端：版主操作台随动作增加持续迭代（`forum-moderation-sticky-ui` / `forum-moderation-post-ops` 规范增补）。
      依赖：`openspec/specs/forum-moderation-post-ops`、`openspec/specs/forum-moderation-sticky-ui`、`openspec/specs/token-identity-consistency`（`forumRole`/`forumBoardIds`）、Issue #17 closed、Issue #7 closed；Issue #4 closed；与 **Issue #19** 可并行规划接口边界。
      非目标：完整 RBAC/权限中台、跨租户隔离、工单流引擎。
    milestone: M3 — 治理与增长
    issue_number: 18
    priority: 主要
    state: open
    module: 治理与审核
    classification: feature
  - title: 举报后续：账号处罚、工单 SLA、举报人通知与证据导出
    body: |
      **新开需求**，承接 Issue #4 已交付最小闭环之外的治理能力；交付以子 Issue / OpenSpec change 拆分为准。
      已交付 change / 子 Issue：
      - Issue #21 举报人结案站内通知（closed）
      - **change-A** `forum-user-sanctions-minimal`（merged）：警告 + 限时禁言；User.Api `user_sanctions` 与内网 status；Model.Api 写操作禁言拦截与版主下发/解封；举报队列 **处罚 reason 必填**、删内容 **reportId 强制且静默**；fail-closed（status 不可用 → 503 `SANCTION_SERVICE_UNAVAILABLE`）；规范见 `openspec/specs/forum-user-sanctions` 等；变更归档 `openspec/changes/archive/2026-05-31-forum-user-sanctions-minimal/`。
      - **change-B** `forum-report-acknowledged-notification`（merged）：`POST /api/mod/reports/{id}/acknowledge` 写 `ReportAcknowledged` 通知；pending 工单保留 status 并记录 acknowledge 字段；与 `ReportResolved` 双节点幂等共存；前端队列「标记已受理」与通知文案；规范见 `openspec/specs/report-acknowledged-notification` 等；变更归档 `openspec/changes/archive/2026-05-31-forum-report-acknowledged-notification/`。
      - Issue #22 举报结案/已受理**写审计**（closed）：`PATCH` 结案写 `report.resolve`/`report.reject`，`Acknowledge` 写 `report.acknowledge`；帖线程审计纳入同帖 `user.*` 与 `report.*`（`metadata.postId`）；规范见 `openspec/specs/forum-report-api`、`forum-moderation-post-ops`、`forum-moderation-sticky-ui`、`forum-user-sanctions` 增量；变更归档 `openspec/changes/archive/2026-06-01-forum-moderation-audit-post-filters/`。
      - **change-C** `forum-report-evidence-export-operational`（merged）：结案写 `forum_report_evidence_snapshots`；`GET /api/mod/reports/{id}/evidence` 运营复盘级 zip（仅 closed；`REPORT_NOT_CLOSED`/`EVIDENCE_EXPIRED`/`REPORT_NOT_FOUND`）；`EvidenceZipBuilder`；snapshot 与 `Forum:ReportRetention:ClosedRetentionDays` 同期 purge；导出时缺失 snapshot 补写；`sanctions-summary` 按 `reportId` 过滤；前端举报队列「导出证据包」；规范见 `openspec/specs/forum-report-evidence-export` 等；变更归档 `openspec/changes/archive/2026-06-01-forum-report-evidence-export-operational/`。
      后续 defer（排期时单开 Issue / OpenSpec change）：SLA / 指派或升级队列，见 `pm-plan.yaml` → `meta.deferred_scope` issue_number 19（与 Issue #18 审计深化并行规划边界）。
      依赖：Issue #4 closed；Issue #21 closed；`openspec/specs/forum-report-api`、`forum-moderation-delete-content`；可与 Issue #18 并行（共享 `audit.metadata.reportId` 契约）。
      非目标：全量封禁（ban）；永久禁言（首期）；JWT claim 携带处罚状态；法务级证据链；单条 Issue 一次性打包全部能力；举报人进度查询 API；处理结论对举报人公开；**版主删帖/删回复向作者发送通知或披露删除原因**。
      交付确认：change-A/B/C 及子 Issue #21/#22 均已 merged/closed；Issue #19 首期治理能力闭环；SLA / 指派移出 M3 首期并登记 defer。
