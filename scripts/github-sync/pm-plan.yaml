  - title: 举报人结案站内通知
    body: |
      验收标准：
      - 举报被版主/管理员关闭（状态流转为已处理或等价）时，举报人收到一条站内通知，通知类型为独立枚举值（如 `ReportResolved`），含举报目标标识（`targetPostId` 或 `targetReplyId`）与处理结论占位文案（如「您的举报已处理」）。
      - 通知在现有 `GET /api/forum/notifications` 列表可查，遵循已读/未读与幂等规范（以 `reportId` 为幂等键，重复关闭举报不重复写入通知）；深链可跳转至被举报内容（若帖子已删则展示「内容已移除」占位）。
      - 通知**不暴露**处理者 `sub`、具体处置行为或其他内部字段；隐私边界在规范中写清。
      依赖：Issue #4 closed（举报数据模型与关闭流程）；Issue #16 closed（通知基础设施）；`openspec/specs/forum-report-api`；`openspec/specs/in-app-notifications`。
      非目标：邮件/短信通知；举报人查询处理进度的 API；SLA 承诺；处理详情对举报人公开。
