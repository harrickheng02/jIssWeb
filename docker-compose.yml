# 复制 .env.example 为 .env 并填写全部变量；docker compose 从 .env 加载
# 仅起数据库与缓存：docker compose up -d mongo redis
# 论坛版主：user-api / model-api 镜像内 appsettings.json 须含同一套 Forum:Moderation（与登录用户 JWT sub 一致），且 Jwt__Key 与签发 token 时一致；勿向容器注入空的 Forum__ 环境变量以免覆盖镜像配置。
services:
  mongo:
    image: mongo:${MONGO_TAG:-7.0}
    container_name: jissweb-mongo
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_ROOT_USER}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: jissweb-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
        "--requirepass",
        "${REDIS_PASSWORD}",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  user-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.User.Api.Dockerfile
    ports:
      - "${USER_API_PORT}:${USER_API_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__DatabaseName: jissweb_user
      Mongo__CustomerDatabaseName: jissweb_customer
      Redis__ConnectionString: redis:6379
      Redis__Password: ${REDIS_PASSWORD}
      Redis__KeyPrefix: "user:"
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: ${JWT_KEY}
      EmailVerification__Secret: ${EMAIL_VERIFICATION_SECRET}
      EmailVerification__LinkBaseUrl: ${EMAIL_VERIFICATION_LINK_BASE_URL}
      EmailVerification__SuccessRedirectUrl: ${EMAIL_VERIFICATION_SUCCESS_REDIRECT_URL}
      EmailVerification__TokenTtlMinutes: 30
      EmailVerification__RegisterPerMinuteLimit: 5
      EmailVerification__ResendPerMinuteLimit: 5
      EmailVerification__ResendCooldownSeconds: ${EMAIL_VERIFY_RESEND_COOLDOWN_SECONDS:-60}
      EmailVerification__ResendPerDayLimit: ${EMAIL_VERIFY_RESEND_PER_DAY_LIMIT:-20}
      PasswordReset__Secret: ${PASSWORD_RESET_SECRET}
      PasswordReset__LinkBaseUrl: ${PASSWORD_RESET_LINK_BASE_URL}
      PasswordReset__SuccessRedirectUrl: ${PASSWORD_RESET_SUCCESS_REDIRECT_URL}
      PasswordReset__TokenTtlMinutes: 30
      PasswordReset__ForgotPerMinuteLimit: 5
      PasswordReset__ForgotCooldownSeconds: 60
      SmtpEmail__Enabled: ${SMTP_ENABLED:-false}
      SmtpEmail__Host: ${SMTP_HOST:-}
      SmtpEmail__Port: ${SMTP_PORT:-587}
      SmtpEmail__Username: ${SMTP_USERNAME:-}
      SmtpEmail__Password: ${SMTP_PASSWORD:-}
      SmtpEmail__FromEmail: ${SMTP_FROM_EMAIL:-}
      SmtpEmail__FromName: ${SMTP_FROM_NAME:-JIssWeb}
      SmtpEmail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      LoginSecurity__WindowMinutes: 15
      LoginSecurity__CooldownThreshold: ${LOGIN_COOLDOWN_THRESHOLD:-3}
      LoginSecurity__CooldownSeconds: ${LOGIN_COOLDOWN_SECONDS:-60}
      LoginSecurity__PairLockThreshold: ${LOGIN_PAIR_LOCK_THRESHOLD:-5}
      LoginSecurity__PairLockMinutes: ${LOGIN_PAIR_LOCK_MINUTES:-5}
      LoginSecurity__IpLockThreshold: ${LOGIN_IP_LOCK_THRESHOLD:-10}
      LoginSecurity__IpLockMinutes: ${LOGIN_IP_LOCK_MINUTES:-30}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-bff:
    build:
      context: .
      dockerfile: docker/JIssWeb.Frontend.Bff.Dockerfile
    ports:
      - "${FRONTEND_BFF_PORT}:${FRONTEND_BFF_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: ${JWT_KEY}
      DownstreamServices__UserApiBaseUrl: ${BFF_USER_API_URL:-http://user-api:5097/}
      DownstreamServices__CustomerApiBaseUrl: ${BFF_CUSTOMER_API_URL:-http://customer-api:5098/}
    depends_on:
      user-api:
        condition: service_started
      customer-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  model-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.Model.Api.Dockerfile
    ports:
      - "${MODEL_API_PORT}:${MODEL_API_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__DatabaseName: jissweb_model
      Mongo__CustomerDatabaseName: jissweb_customer
      Redis__ConnectionString: redis:6379
      Redis__Password: ${REDIS_PASSWORD}
      Redis__KeyPrefix: "model:"
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: ${JWT_KEY}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  customer-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.Customer.Api.Dockerfile
    ports:
      - "${CUSTOMER_API_PORT:-5098}:${CUSTOMER_API_CONTAINER_PORT:-5098}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: ${MONGO_CONNECTION_STRING}
      Mongo__DatabaseName: jissweb_customer
      Redis__ConnectionString: redis:6379
      Redis__Password: ${REDIS_PASSWORD}
      Redis__KeyPrefix: "customer:"
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: ${JWT_KEY}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.Gateway.Api.Dockerfile
    ports:
      - "${GATEWAY_API_PORT}:${GATEWAY_API_CONTAINER_PORT}"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: ${JWT_KEY}
      ReverseProxy__Clusters__user-service__Destinations__d1__Address: ${GATEWAY_USER_API_URL:-http://user-api:5097/}
      ReverseProxy__Clusters__customer-service__Destinations__d1__Address: ${GATEWAY_CUSTOMER_API_URL:-http://customer-api:5098/}
      ReverseProxy__Clusters__frontend-bff__Destinations__d1__Address: ${GATEWAY_BFF_URL:-http://frontend-bff:5095/}
      ReverseProxy__Clusters__model-service__Destinations__d1__Address: ${GATEWAY_MODEL_API_URL:-http://model-api:5099/}
    depends_on:
      user-api:
        condition: service_started
      customer-api:
        condition: service_started
      frontend-bff:
        condition: service_started
      model-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
    name: ${MONGO_VOLUME_NAME:-jissweb_mongo_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-jissweb_redis_data}
