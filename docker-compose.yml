# 默认 `docker compose up` / Docker Desktop 启动：mongo、redis、user-api、model-api、frontend-bff、gateway-api
# 仅起数据库与缓存：docker compose up -d mongo redis
services:
  mongo:
    image: mongo:${MONGO_TAG:-7.0}
    container_name: jissweb-mongo
    ports:
      - "${MONGO_PORT:-37017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: harrickheng
      MONGO_INITDB_ROOT_PASSWORD: qq!219673605
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "harrickheng", "-p", "qq!219673605", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:${REDIS_TAG:-7-alpine}
    container_name: jissweb-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "qq!219673605", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  user-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.User.Api.Dockerfile
    ports:
      - "${USER_API_PORT:-5097}:5097"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://harrickheng:qq%21219673605@mongo:27017/?authSource=admin
      Mongo__DatabaseName: jissweb_user
      Redis__ConnectionString: redis:6379
      Redis__Password: qq!219673605
      Redis__KeyPrefix: "user:"
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: change-me-in-production-use-32-chars-min!!
      EmailVerification__Secret: change-me-email-verify-secret
      EmailVerification__LinkBaseUrl: http://localhost:5097/api/auth/verify-email
      EmailVerification__SuccessRedirectUrl: http://localhost:5173/register/verified
      EmailVerification__TokenTtlMinutes: 30
      EmailVerification__RegisterPerMinuteLimit: 5
      EmailVerification__ResendPerMinuteLimit: 5
      EmailVerification__ResendCooldownSeconds: ${EMAIL_VERIFY_RESEND_COOLDOWN_SECONDS:-60}
      EmailVerification__ResendPerDayLimit: ${EMAIL_VERIFY_RESEND_PER_DAY_LIMIT:-20}
      SmtpEmail__Enabled: ${SMTP_ENABLED:-false}
      SmtpEmail__Host: ${SMTP_HOST:-}
      SmtpEmail__Port: ${SMTP_PORT:-587}
      SmtpEmail__Username: ${SMTP_USERNAME:-}
      SmtpEmail__Password: ${SMTP_PASSWORD:-}
      SmtpEmail__FromEmail: ${SMTP_FROM_EMAIL:-}
      SmtpEmail__FromName: ${SMTP_FROM_NAME:-JIssWeb}
      SmtpEmail__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      LoginSecurity__WindowMinutes: 15
      LoginSecurity__CooldownThreshold: ${LOGIN_COOLDOWN_THRESHOLD:-3}
      LoginSecurity__CooldownSeconds: ${LOGIN_COOLDOWN_SECONDS:-60}
      LoginSecurity__PairLockThreshold: ${LOGIN_PAIR_LOCK_THRESHOLD:-5}
      LoginSecurity__PairLockMinutes: ${LOGIN_PAIR_LOCK_MINUTES:-5}
      LoginSecurity__IpLockThreshold: ${LOGIN_IP_LOCK_THRESHOLD:-10}
      LoginSecurity__IpLockMinutes: ${LOGIN_IP_LOCK_MINUTES:-30}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-bff:
    build:
      context: .
      dockerfile: docker/JIssWeb.Frontend.Bff.Dockerfile
    ports:
      - "${FRONTEND_BFF_PORT:-5095}:5095"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: change-me-in-production-use-32-chars-min!!
      DownstreamServices__UserApiBaseUrl: ${BFF_USER_API_URL:-http://user-api:5097}
      DownstreamServices__CustomerApiBaseUrl: ${BFF_CUSTOMER_API_URL:-http://host.docker.internal:5098}
    depends_on:
      user-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  model-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.Model.Api.Dockerfile
    ports:
      - "${MODEL_API_PORT:-5099}:5099"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://harrickheng:qq%21219673605@mongo:27017/?authSource=admin
      Mongo__DatabaseName: jissweb_model
      Redis__ConnectionString: redis:6379
      Redis__Password: qq!219673605
      Redis__KeyPrefix: "model:"
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: change-me-in-production-use-32-chars-min!!
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway-api:
    build:
      context: .
      dockerfile: docker/JIssWeb.Gateway.Api.Dockerfile
    ports:
      - "${GATEWAY_API_PORT:-5094}:5094"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      Jwt__Issuer: JIssWeb
      Jwt__Audience: JIssWeb
      Jwt__Key: change-me-in-production-use-32-chars-min!!
      ReverseProxy__Clusters__user-service__Destinations__d1__Address: ${GATEWAY_USER_API_URL:-http://user-api:5097/}
      ReverseProxy__Clusters__customer-service__Destinations__d1__Address: ${GATEWAY_CUSTOMER_API_URL:-http://host.docker.internal:5098/}
      ReverseProxy__Clusters__frontend-bff__Destinations__d1__Address: ${GATEWAY_BFF_URL:-http://frontend-bff:5095/}
      ReverseProxy__Clusters__model-service__Destinations__d1__Address: ${GATEWAY_MODEL_API_URL:-http://model-api:5099/}
    depends_on:
      user-api:
        condition: service_started
      frontend-bff:
        condition: service_started
      model-api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mongo_data:
    name: ${MONGO_VOLUME_NAME:-jissweb_mongo_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-jissweb_redis_data}
